<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1713">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Learn snooker safety by drawing the cue ball's route and testing it on a physics table. Works offline.">
  <title>Snooker Safety Coach</title>
  <style>/* Snooker Safety Coach — "clubhouse" theme: baize green, walnut and brass. No external fonts or files. */
:root {
  color-scheme: dark;
  --bg: #0a1713; --bg-2: #0e1f19; --surface: #12261f; --surface-2: #18322a; --surface-3: #214238;
  --line: #2d4d42; --line-soft: #223c33;
  --ink: #f4eedb; --ink-2: #cbd9d0; --ink-3: #9eb5aa;
  --brass: #e3b94f; --brass-2: #f3d27f; --brass-ink: #1b1405;
  --route: #59d0ff; --good: #7be0a4; --warn: #ffb454; --bad: #ff8a73;
  --radius: 16px; --radius-sm: 11px;
  --shadow: 0 14px 36px rgba(0, 0, 0, .38);
  --font-head: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --gutter: clamp(16px, 4vw, 40px); --maxw: 1240px;
  --tabbar: 0px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font: 400 17px/1.55 var(--font-body);
  background:
    radial-gradient(1100px 520px at 12% -8%, #17402f 0%, transparent 62%),
    radial-gradient(900px 480px at 100% 0%, #112e3a 0%, transparent 55%),
    var(--bg);
  background-attachment: fixed;
  display: flex; flex-direction: column;
}
main { flex: 1; outline: none; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 700; line-height: 1.12; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(32px, 4.6vw, 48px); }
h2 { font-size: clamp(22px, 2.6vw, 28px); }
h3 { font-size: 20px; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--route); outline-offset: 3px; border-radius: 6px; }
canvas:focus-visible { outline-offset: 4px; border-radius: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--brass); color: var(--brass-ink); padding: 10px 16px; border-radius: 10px; font-weight: 700; }
.skip-link:focus { top: 12px; }
.grow { flex: 1; }
.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.22em; }
.icon.big { width: 40px; height: 40px; } .icon.xl { width: 52px; height: 52px; stroke-width: 1.6; }
kbd { font: 600 .82em var(--font-body); background: var(--surface-3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; }

/* ---------- top bar and navigation ---------- */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 20px; padding: 10px var(--gutter); background: #0a1713f2; border-bottom: 1px solid var(--line-soft); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; }
.brand-mark { width: 40px; height: 40px; }
.brand-text { font: 400 20px/1 var(--font-head); letter-spacing: .01em; white-space: nowrap; }
.brand-text b { color: var(--brass); font-weight: 700; }
.nav { display: flex; gap: 4px; }
.nav a { white-space: nowrap; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 15.5px; border: 1px solid transparent; transition: background .15s, color .15s; }
.nav a:hover { background: var(--surface); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--ink); border-color: var(--line); box-shadow: inset 0 -3px 0 var(--brass); }
.top-actions { display: flex; gap: 8px; }
.footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 22px var(--gutter) calc(26px + var(--tabbar)); color: var(--ink-3); font-size: 14px; border-top: 1px solid var(--line-soft); }

.view { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 28px var(--gutter) 56px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.view-head.tight { margin-bottom: 16px; }
.eyebrow { font: 700 12.5px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .14em; color: var(--brass); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.lede { font-size: 19px; color: var(--ink-2); max-width: 38ch; }
.section-title { margin-bottom: 18px; }
.fine { font-size: 14.5px; color: var(--ink-3); line-height: 1.5; }
.back-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink-2); text-decoration: none; font-weight: 600; padding-right: 8px; }
.back-link:hover { color: var(--brass-2); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; font-size: 15.5px; line-height: 1.1; text-decoration: none; transition: background .15s, transform .08s, box-shadow .15s, border-color .15s; user-select: none; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] { opacity: .42; cursor: not-allowed; }
.btn-primary { background: linear-gradient(180deg, #f1cc70, var(--brass)); color: var(--brass-ink); box-shadow: 0 6px 18px rgba(227, 185, 79, .22), inset 0 1px 0 #fff6; }
.btn-primary:hover:not([disabled]) { background: linear-gradient(180deg, #f8dd95, #edc45c); box-shadow: 0 8px 24px rgba(227, 185, 79, .32), inset 0 1px 0 #fff8; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not([disabled]) { background: var(--surface-2); border-color: #46705f; }
.btn-danger { background: transparent; border-color: #8a4a3f; color: var(--bad); }
.btn-danger:hover:not([disabled]) { background: #ff8a7322; }
.btn-xl { min-height: 54px; padding: 0 26px; font-size: 17px; }
.btn-small { min-height: 38px; padding: 0 14px; font-size: 14.5px; border-radius: 10px; }
.btn-round { width: 52px; min-height: 52px; padding: 0; border-radius: 50%; }
.btn.loading::after { content: ""; width: 16px; height: 16px; border: 2.5px solid #1b140555; border-top-color: var(--brass-ink); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); transition: background .15s; }
.icon-btn:hover:not([disabled]) { background: var(--surface-2); }
.icon-btn[disabled] { opacity: .4; cursor: not-allowed; }
.button-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.button-row.center { justify-content: center; }
.button-row.stack { flex-direction: column; align-items: stretch; }
.button-row.stack .btn { width: 100%; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 14.5px; color: var(--ink-2); transition: all .15s; }
.chip b { font-weight: 600; color: var(--ink-3); font-size: 13px; }
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: #e3b94f26; border-color: var(--brass); color: var(--brass-2); }
.chip.small { min-height: 34px; padding: 0 12px; font-size: 14px; }
.chip-static { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
.chip-static.good { border-color: #3f8a60; color: var(--good); background: #7be0a414; }
.chip-static.bad { border-color: #9a5448; color: var(--bad); background: #ff8a7314; }
.chip-static.warn { border-color: #9a7338; color: var(--warn); background: #ffb45414; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 700; background: var(--surface-3); color: var(--ink-2); }
.pill.good { background: #7be0a41f; color: var(--good); } .pill.info { background: #59d0ff1f; color: var(--route); } .pill.warn { background: #ffb4541f; color: var(--warn); }
.tag { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); }

.switch-chip, .row-switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--ink-2); min-height: 40px; }
.switch-chip input, .row-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; left: 0; top: 0; margin: 0; cursor: pointer; }
.switch-box { width: 42px; height: 24px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line); position: relative; flex: none; transition: background .15s, border-color .15s; }
.switch-box::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink-2); transition: transform .18s, background .15s; }
input:checked + .switch-box, .row-switch input:checked ~ .switch-box { background: #e3b94f40; border-color: var(--brass); }
input:checked + .switch-box::after, .row-switch input:checked ~ .switch-box::after { transform: translateX(18px); background: var(--brass-2); }
input:focus-visible + .switch-box, .row-switch input:focus-visible ~ .switch-box { outline: 3px solid var(--route); outline-offset: 3px; }

.segmented { display: inline-flex; padding: 4px; gap: 2px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); }
.segmented button { min-height: 38px; padding: 0 16px; border-radius: 9px; border: 0; background: transparent; font-weight: 700; font-size: 14.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; }
.segmented button:hover:not([disabled]):not([aria-pressed="true"]) { background: var(--surface-2); }
.segmented button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
.segmented button[disabled] { opacity: .4; cursor: not-allowed; }
.segmented.small button { min-height: 32px; padding: 0 11px; font-size: 13.5px; }

.meter { height: 8px; border-radius: 999px; background: #ffffff14; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #c99a2e, var(--brass-2)); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.meter.big { height: 12px; }
.empty { text-align: center; padding: 48px 20px; color: var(--ink-2); border: 1px dashed var(--line); border-radius: var(--radius); display: grid; gap: 14px; justify-items: center; }
.empty.small { padding: 24px 16px; } .empty h2 { color: var(--ink); } .empty p { max-width: 46ch; }
.empty-art { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--brass); }
.empty.good .empty-art { color: var(--good); }
details.soft { border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; background: var(--surface); }
details.soft summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; list-style: none; gap: 8px; }
details.soft summary::before { content: "▸"; color: var(--brass); transition: transform .15s; }
details.soft[open] summary::before { transform: rotate(90deg); }
details.soft[open] { padding-bottom: 16px; }
ul.plain { margin: 8px 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
dl.facts { display: grid; gap: 8px; margin: 12px 0; } dl.facts div { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; border-bottom: 1px solid var(--line-soft); padding-bottom: 6px; } dl.facts dt { color: var(--ink-3); } dl.facts dd { margin: 0; font-weight: 600; text-align: right; }

/* ---------- table frame ---------- */
/* The table never grows so tall that the controls under it fall off the screen. */
.results-stage .table-frame { width: min(100%, max(540px, calc((100dvh - 330px) * 1.83))); margin-inline: auto; }
#view-practice .table-frame { width: min(100%, max(540px, calc((100dvh - 420px) * 1.83))); margin-inline: auto; }
.practice-layout { display: flex; flex-direction: column; gap: 0; }
.practice-side { display: contents; }
.practice-side > .goal-strip { order: 1; } .practice-side > .hint-line { order: 2; } .practice-main { order: 3; } .practice-side > .status-row { order: 4; } .practice-side > .action-bar { order: 5; }
@media (min-width: 1100px) {
  .practice-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  .practice-main { order: 0; } .practice-side { display: grid; gap: 14px; position: sticky; top: 84px; align-content: start; }
  .practice-side > * { order: 0 !important; }
  #view-practice .table-frame { width: min(100%, calc((100dvh - 210px) * 1.83)); min-width: min(100%, 540px); }
  .practice-side .goal-strip { margin: 0; flex-direction: column; align-items: flex-start; gap: 10px; border-left-width: 1px; border-top: 4px solid var(--brass); }
  .practice-side .hint-line { margin: 0; }
  .practice-side .status-row { margin: 0; display: grid; gap: 10px; }
  .practice-side .helper { flex: none; }
  .practice-side #pr-straight { justify-self: start; }
  .practice-side .action-bar { display: grid; gap: 12px; border-top: 0; padding: 0; }
  .practice-side .action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .practice-side .action-group .btn { width: 100%; }
  .practice-side .action-bar > .btn-xl { width: 100%; }
}
#view-free .table-frame { width: min(100%, max(540px, calc((100dvh - 500px) * 1.83))); margin-inline: auto; }
@media (min-width: 1200px) {
  .free-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  #view-free .table-frame { width: min(100%, max(540px, calc((100dvh - 290px) * 1.83))); }
  .free-side { display: grid; gap: 14px; position: sticky; top: 84px; }
  .free-side .dock { grid-template-columns: 1fr; gap: 12px; }
  .free-side .shoot { flex-direction: row; min-height: 62px; }
  .free-side .arrange { margin-top: 0; }
}
.table-frame { position: relative; border-radius: 16px; box-shadow: 0 26px 60px rgba(0, 0, 0, .5), 0 0 0 1px #ffffff10; }
.table-frame canvas { display: block; width: 100%; height: auto; aspect-ratio: 1.83; border-radius: 16px; }
.table-frame canvas.interactive { touch-action: none; cursor: crosshair; }
.stage-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 16px; }
.stage-overlay > * { pointer-events: auto; }
.stage { display: grid; gap: 14px; }
.route-chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; }
.route-chips:empty { display: none; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: clamp(28px, 5vw, 64px); align-items: center; padding: 12px 0 40px; }
.hero h1 { font-size: clamp(42px, 6.4vw, 78px); line-height: 1; margin-bottom: 22px; }
.hero h1 em { color: var(--brass); font-style: italic; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0 22px; }
.hero-note { color: var(--ink-3); font-size: 15px; display: flex; gap: 8px; align-items: center; }
.demo-steps { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.demo-steps li { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-soft); color: var(--ink-3); font-weight: 700; font-size: 15px; transition: all .25s; }
.demo-steps li.active { background: #e3b94f1f; border-color: var(--brass); color: var(--brass-2); }
.step-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 52px; }
.step-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 24px; display: grid; gap: 10px; }
.step-card p { color: var(--ink-2); font-size: 16px; }
.step-art { color: var(--brass); }
.path { margin-bottom: 52px; }
.path-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.next-card { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1fr); gap: 18px; padding: 16px; border-radius: var(--radius); background: linear-gradient(135deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); text-decoration: none; align-items: center; transition: border-color .15s, transform .15s; }
.next-card:hover { border-color: var(--brass); transform: translateY(-2px); }
.next-thumb canvas { width: 100%; height: auto; aspect-ratio: 1.83; display: block; border-radius: 10px; }
.next-body { display: grid; gap: 8px; justify-items: start; } .next-body p { color: var(--ink-2); font-size: 15.5px; }
.level-strip { display: grid; gap: 8px; align-content: start; }
.level-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 90px 42px; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line-soft); text-decoration: none; transition: border-color .15s; }
.level-row:hover { border-color: var(--line); }
.level-name { display: grid; line-height: 1.25; } .level-name small { color: var(--ink-3); font-size: 13.5px; }
.level-count { color: var(--ink-3); font-weight: 700; font-size: 14px; text-align: right; }
.level-badge { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 17px var(--font-head); background: var(--surface-3); color: var(--brass-2); border: 1px solid var(--line); flex: none; }
.level-badge.custom { color: var(--route); }
.more-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line-soft); text-decoration: none; text-align: left; color: var(--ink); transition: border-color .15s, background .15s; }
.tile:hover { border-color: var(--brass); background: var(--surface-2); }
.tile > span:nth-child(2) { display: grid; flex: 1; } .tile small { color: var(--ink-3); font-size: 14.5px; } .tile strong { font-size: 17px; }
.tile-icon { width: 46px; height: 46px; border-radius: 13px; background: var(--surface-3); display: grid; place-items: center; color: var(--brass); flex: none; }

/* ---------- library ---------- */
.progress-pill { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-soft); }
.progress-pill .meter { width: 120px; }
.progress-text { display: grid; line-height: 1.2; } .progress-text strong { font-size: 22px; font-family: var(--font-head); color: var(--brass-2); display: inline; } .progress-text span { font-size: 13.5px; color: var(--ink-3); }
.filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
.level-block { margin-bottom: 40px; }
.level-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.level-head h2 { display: flex; align-items: center; gap: 12px; font-size: 24px; }
.level-head p { color: var(--ink-3); } .level-head .level-count { margin-left: auto; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 18px; }
.puzzle-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; text-decoration: none; transition: transform .18s, border-color .18s, box-shadow .18s; }
.puzzle-card:hover { transform: translateY(-4px); border-color: var(--brass); box-shadow: var(--shadow); }
.puzzle-card[data-status="mastered"] { border-color: #3f8a6088; }
.card-thumb { position: relative; background: #0d2a21; }
.card-thumb canvas { display: block; width: 100%; height: auto; aspect-ratio: 1.83; }
.card-tactic, .card-state, .card-next { position: absolute; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #0a1713e6; border: 1px solid var(--line); color: var(--ink-2); }
.card-tactic { left: 10px; bottom: 10px; } .card-state { right: 10px; top: 10px; } .card-next { left: 10px; top: 10px; background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.card-state.state-mastered { color: var(--good); border-color: #3f8a60; } .card-state.state-promising { color: var(--brass-2); } .card-state.state-tried { color: var(--route); } .card-state.state-new { color: var(--ink-3); }
.card-body { padding: 16px 18px 18px; display: grid; gap: 8px; flex: 1; align-content: start; }
.card-body h3 { font-size: 19px; display: flex; gap: 10px; align-items: baseline; } .card-number { font: 600 14px var(--font-body); color: var(--brass); }
.card-body p { color: var(--ink-2); font-size: 15px; line-height: 1.45; }
.card-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.dots { display: inline-flex; gap: 4px; margin-right: 4px; } .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--line); } .dots i.on { background: var(--brass); border-color: var(--brass); }
.create-card { border-style: dashed; justify-content: center; } .create-art { display: grid; place-items: center; padding: 28px 0 0; color: var(--brass); }

/* ---------- practice ---------- */
.practice-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; margin-bottom: 14px; }
.practice-title { display: flex; align-items: center; gap: 14px; min-width: 0; }
.practice-title h1 { font-size: clamp(24px, 3.2vw, 34px); overflow-wrap: anywhere; }
.level-chip { flex: none; padding: 4px 12px; border-radius: 999px; background: var(--surface-3); color: var(--brass-2); font-weight: 700; font-size: 13.5px; border: 1px solid var(--line); }
.practice-tools { display: flex; align-items: center; gap: 8px; }
.practice-tools .count { min-width: 56px; text-align: center; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.goal-strip { display: flex; align-items: center; gap: 16px; padding: 14px 20px; margin-bottom: 14px; border-radius: 14px; border: 1px solid var(--line); border-left: 5px solid var(--brass); background: linear-gradient(90deg, var(--surface-2), var(--surface)); }
.goal-strip p { font: 600 clamp(17px, 2vw, 21px)/1.35 var(--font-body); }
.goal-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #e3b94f26; color: var(--brass-2); flex: none; font-size: 22px; }
.hint-line { display: flex; gap: 10px; align-items: center; padding: 10px 16px; margin-bottom: 14px; border-radius: 12px; background: #e3b94f1c; border: 1px solid #e3b94f66; color: var(--brass-2); font-weight: 600; }
.status-row { display: flex; align-items: center; gap: 12px 22px; flex-wrap: wrap; margin: 14px 0 10px; }
.steps-line { list-style: none; display: flex; gap: 8px; margin: 0; padding: 0; }
.steps-line li { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; font-weight: 700; font-size: 14.5px; color: var(--ink-3); border: 1px solid var(--line-soft); }
.steps-line li span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-size: 13px; }
.steps-line li.active { color: var(--brass-2); border-color: var(--brass); background: #e3b94f14; } .steps-line li.active span { background: var(--brass); color: var(--brass-ink); }
.steps-line li.done span { background: #7be0a433; color: var(--good); }
.helper { color: var(--ink-2); font-size: 16.5px; flex: 1 1 280px; }
.action-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 0 0; border-top: 1px solid var(--line-soft); }
.action-group { display: flex; gap: 8px; flex-wrap: wrap; }
.start-bubble { position: absolute; display: flex; align-items: center; gap: 10px; max-width: 240px; padding: 10px 14px; border-radius: 14px; background: var(--ink); color: #12261f; font-weight: 700; font-size: 15px; line-height: 1.25; box-shadow: var(--shadow); pointer-events: none; animation: bob 2.2s ease-in-out infinite; }
.start-bubble::after { content: ""; position: absolute; left: 22px; bottom: -8px; border: 9px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.start-bubble.below::after { bottom: auto; top: -8px; border-top: 0; border-bottom: 9px solid var(--ink); border-top-color: transparent; }
.bubble-hand { color: #0f7aa6; display: grid; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.remove-point { position: absolute; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #0a1713f5; border: 1px solid var(--bad); color: var(--bad); font-weight: 700; font-size: 14px; box-shadow: var(--shadow); }
.remove-point:hover { background: #3a1914; }
.check-overlay { position: absolute; inset: 0; display: grid; place-items: center; background: #06100cd9; border-radius: 16px; }
.check-card { width: min(380px, calc(100% - 32px)); text-align: center; display: grid; gap: 12px; padding: 24px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); justify-items: center; }
.check-card .meter { width: 100%; } .check-card p { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rolling-ball { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9cfbd); box-shadow: 0 6px 10px #0006; animation: roll 1.1s ease-in-out infinite alternate; }
@keyframes roll { from { transform: translateX(-70px) rotate(0); } to { transform: translateX(70px) rotate(540deg); } }
.notes-list { display: grid; gap: 14px; margin: 16px 0; } .notes-list dt { font-weight: 700; color: var(--brass-2); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; } .notes-list dd { margin: 0; color: var(--ink); }
.source { margin: 14px 0; font-size: 13.5px; color: var(--ink-3); }

/* ---------- results ---------- */
.results-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.results-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); grid-template-areas: "stage summary" "stage detail"; gap: 20px 24px; align-items: start; }
.results-stage { grid-area: stage; } .score-summary { grid-area: summary; } .score-detail { grid-area: detail; }
.detail-title { font-size: 20px; }
.results-stage { display: grid; gap: 14px; }
.replay-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-soft); }
.scrub { position: relative; flex: 1 1 180px; min-width: 140px; height: 44px; display: flex; align-items: center; }
.scrub input { width: 100%; margin: 0; background: transparent; appearance: none; height: 44px; cursor: pointer; }
.scrub-marks { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
.scrub-marks .mark { position: absolute; top: -13px; width: 3px; height: 8px; margin-left: -1.5px; border-radius: 2px; background: var(--ink-2); }
.scrub-marks .mark.cushion { background: var(--brass); } .scrub-marks .mark.pocket { background: var(--bad); }
.time { min-width: 50px; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; font-size: 14.5px; }
input[type="range"] { appearance: none; -webkit-appearance: none; background: transparent; accent-color: var(--brass); }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: var(--brass-2); border: 3px solid #1b1405; box-shadow: 0 2px 8px #0008; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--brass-2); border: 3px solid #1b1405; }
.note-line { display: flex; gap: 10px; align-items: center; color: var(--warn); font-size: 15px; }
.layers { margin-top: 2px; }
.score-card { display: grid; gap: 18px; padding: 24px; border-radius: 20px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); box-shadow: var(--shadow); }
.score-top { display: flex; align-items: center; gap: 20px; }
.score-title { display: grid; gap: 8px; justify-items: start; } .score-title .eyebrow { margin: 0; } .score-title h2 { font-size: 30px; }
.ring { position: relative; width: 124px; height: 124px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: #ffffff17; stroke-width: 10; }
.ring-fill { fill: none; stroke: var(--brass); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
.ring[data-grade="Excellent"] .ring-fill { stroke: var(--good); } .ring[data-grade="Developing"] .ring-fill { stroke: var(--route); }
.ring-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1; }
.ring-text strong { font: 700 40px var(--font-head); font-variant-numeric: tabular-nums; } .ring-text span { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.tip { padding: 14px 16px; border-radius: 13px; background: #00000030; border-left: 4px solid var(--brass); font-size: 17.5px; line-height: 1.45; }
.tip-label { display: block; font: 700 12px var(--font-body); text-transform: uppercase; letter-spacing: .12em; color: var(--brass); margin-bottom: 4px; }
.alt-badge { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 13px; background: #7be0a414; border: 1px solid #3f8a60; color: var(--good); font-weight: 600; font-size: 15.5px; }
.meters { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.meter-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; } .meter-name small { color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
.meter-top strong { font: 700 20px var(--font-head); font-variant-numeric: tabular-nums; }
.meter-row p { margin-top: 6px; color: var(--ink-2); font-size: 14.5px; line-height: 1.4; }
.meter-row.good .meter i { background: linear-gradient(90deg, #3fb577, var(--good)); } .meter-row.low .meter i { background: linear-gradient(90deg, #d46a55, var(--bad)); }

/* ---------- free table ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
.aim-readout { position: absolute; padding: 3px 10px; border-radius: 999px; background: #0a1713e6; border: 1px solid var(--line); font: 700 14px var(--font-body); font-variant-numeric: tabular-nums; pointer-events: none; }
.dock { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.15fr) minmax(0, 1.1fr) auto; gap: 14px; align-items: stretch; }
.dock-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.dock-card.wide { grid-column: 1 / -1; }
.dock-card h2 { font: 700 16px var(--font-body); display: flex; align-items: center; gap: 8px; letter-spacing: 0; color: var(--ink); }
.dock-card h2 output { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--brass-2); }
.angle-row { display: flex; align-items: center; gap: 10px; }
.angle-field { position: relative; flex: 1; } .angle-field input { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); padding: 0 30px 0 14px; font: 700 20px var(--font-body); font-variant-numeric: tabular-nums; text-align: center; }
.angle-field i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-3); }
.power-range { width: 100%; height: 44px; }
.power-range::-webkit-slider-runnable-track { background: linear-gradient(90deg, #3fb577, #e3b94f 55%, #e0604b); height: 10px; }
.power-range::-moz-range-track { background: linear-gradient(90deg, #3fb577, #e3b94f 55%, #e0604b); height: 10px; }
.spin-layout { display: flex; gap: 14px; align-items: center; }
.spin-layout canvas { width: 104px; height: 104px; border-radius: 50%; touch-action: none; cursor: crosshair; flex: none; }
.spin-side { display: grid; gap: 8px; flex: 1; min-width: 0; } .spin-side p { font-weight: 700; }
.spin-side .chip-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .spin-side .chip { justify-content: center; padding: 0 8px; }
.shoot { align-self: stretch; flex-direction: column; min-width: 150px; gap: 8px; font-size: 18px; }
.shoot .icon { width: 30px; height: 30px; }
.arrange { margin-top: 16px; }
.palette { display: flex; flex-wrap: wrap; gap: 10px; }
.palette-ball { position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px 0 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg-2); font-weight: 700; }
.palette-ball i { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff9, var(--ball) 40%, #0008); box-shadow: 0 3px 6px #0007; }
.palette-ball b { color: var(--good); font-size: 13px; }
.palette-ball:hover { border-color: var(--brass); }

/* ---------- create ---------- */
.builder { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; margin-bottom: 44px; }
.builder-preview { display: grid; gap: 10px; position: sticky; top: 84px; }
.builder-fields { display: grid; gap: 18px; }
.field { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend { font-weight: 700; font-size: 15.5px; display: flex; justify-content: space-between; gap: 8px; padding: 0; } .field small { color: var(--ink-3); font-weight: 500; }
.field input:not([type="range"]):not([type="radio"]), .field select, .field textarea { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); }
.field textarea { resize: vertical; line-height: 1.45; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field output { color: var(--brass-2); font-variant-numeric: tabular-nums; }
.radio-cards { display: grid; gap: 8px; }
.radio-card { position: relative; display: block; cursor: pointer; }
.radio-card input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.radio-card span { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); }
.radio-card input:checked + span { border-color: var(--brass); background: #e3b94f1c; color: var(--brass-2); }
.radio-card input:focus-visible + span { outline: 3px solid var(--route); outline-offset: 2px; }
.form-error { padding: 12px 14px; border-radius: 12px; background: #ff8a7318; border: 1px solid #9a5448; color: var(--bad); font-weight: 600; }
.section-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; } .section-row .section-title { margin: 0; }
.mine-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.mine-list li { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-soft); }
.mine-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-3); color: var(--brass); flex: none; }
.mine-text { display: grid; flex: 1; min-width: 0; } .mine-text small { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- settings ---------- */
.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.settings-grid .panel:first-child { grid-row: span 2; }
.panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 22px; display: grid; gap: 16px; }
.panel h2 { font: 700 20px var(--font-head); display: flex; align-items: center; gap: 10px; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.preset { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--bg-2); min-height: 76px; }
.preset small { color: var(--ink-3); font-size: 13.5px; line-height: 1.35; } .preset:hover { border-color: #46705f; }
.preset[aria-pressed="true"] { border-color: var(--brass); background: #e3b94f1c; }
.slider-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 1fr) 70px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.slider-row span { display: grid; } .slider-row small { color: var(--ink-3); font-size: 13px; line-height: 1.3; } .slider-row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--brass-2); font-weight: 700; font-size: 14.5px; }
.row-switch { justify-content: space-between; width: 100%; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.row-switch > span:first-child, .row-select > span:first-child { display: grid; } .row-switch small, .row-select small { color: var(--ink-3); font-weight: 400; font-size: 13.5px; }
.row-select { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 8px 0; }

/* ---------- dialog, toast, guide ---------- */
dialog { border: 0; padding: 0; background: transparent; color: inherit; width: min(560px, calc(100vw - 24px)); max-height: none; }
dialog.wide { width: min(760px, calc(100vw - 24px)); }
dialog::backdrop { background: #030a08cc; }
.dialog-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 30px; max-height: calc(100dvh - 32px); overflow: auto; box-shadow: var(--shadow); }
.dialog-close { position: absolute; right: 12px; top: 12px; z-index: 2; }
.dialog-card h2 { margin-bottom: 10px; padding-right: 44px; } .dialog-card h2:focus { outline: none; }
.confirm { display: grid; gap: 14px; } .confirm .button-row { justify-content: flex-end; margin-top: 6px; }
.notes { display: grid; gap: 10px; }
.guide { display: grid; gap: 12px; }
.guide-frame { border-radius: 14px; overflow: hidden; background: #0d2a21; }
.guide-art { display: block; width: 100%; height: auto; }
.guide-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.dots-nav { display: flex; gap: 8px; } .dots-nav i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); } .dots-nav i.on { background: var(--brass); width: 26px; border-radius: 6px; }
.g-draw { animation: gdraw 2.6s ease-in-out infinite; } @keyframes gdraw { 0% { stroke-dashoffset: 190; } 60%, 100% { stroke-dashoffset: 0; } }
.g-pulse { animation: gpulse 1.6s ease-out infinite; transform-origin: 70px 112px; } @keyframes gpulse { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.g-ring { animation: gring 2.8s ease-out infinite; } @keyframes gring { 0% { stroke-dashoffset: 214; } 60%, 100% { stroke-dashoffset: 30; } }
.g-bar { transform-origin: 196px 0; animation: gbar 2.8s ease-out infinite; transform-box: fill-box; } @keyframes gbar { 0% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }
#toast-region { position: fixed; left: 50%; bottom: calc(24px + var(--tabbar)); z-index: 60; transform: translate(-50%, 24px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; width: max-content; max-width: calc(100vw - 32px); }
#toast-region.show { opacity: 1; transform: translate(-50%, 0); }
.toast { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-radius: 14px; background: #f4eedb; color: #12261f; font-weight: 600; font-size: 15.5px; box-shadow: var(--shadow); }
.toast-good { background: #c9f3da; } .toast-warn { background: #ffe3b8; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .nav a { padding: 0 12px; gap: 6px; font-size: 15px; } .top-actions .btn span { display: none; } .top-actions .btn { width: 44px; padding: 0; } .topbar { gap: 12px; }
}
@media (max-width: 1100px) {
  .dock { grid-template-columns: 1fr 1fr; } .shoot { grid-column: 1 / -1; flex-direction: row; min-height: 60px; }
  .builder { grid-template-columns: 1fr; } .builder-preview { position: static; }
}
@media (max-width: 920px) {
  .results-grid { grid-template-columns: 1fr; grid-template-areas: "summary" "stage" "detail"; }
}
@media (max-width: 880px) {
  :root { --tabbar: 76px; }
  body { font-size: 16.5px; }
  .brand-text { font-size: 18px; } .top-actions .btn span { display: none; } .top-actions .btn { width: 44px; padding: 0; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); gap: 2px; background: #0a1713; border-top: 1px solid var(--line); }
  .nav a { flex: 1; flex-direction: column; justify-content: center; gap: 3px; padding: 4px 2px; min-height: 58px; font-size: 12.5px; border-radius: 12px; }
  .nav a .icon { width: 24px; height: 24px; } .nav a[aria-current="page"] { box-shadow: inset 0 3px 0 var(--brass); }
  .hero { grid-template-columns: 1fr; padding-top: 0; } .hero-demo { order: -1; }
  .step-grid, .more-grid, .path-grid { grid-template-columns: 1fr; }
  .practice-head { grid-template-columns: auto 1fr; gap: 8px 12px; } .practice-tools { justify-self: end; } .practice-title { grid-column: 1 / -1; order: 3; } .back-link span { white-space: nowrap; }
  .settings-grid { grid-template-columns: 1fr; } .settings-grid .panel:first-child { grid-row: auto; }
  .action-bar { position: sticky; bottom: var(--tabbar); z-index: 20; background: #0a1713f5; padding: 10px 0 12px; margin: 0 calc(var(--gutter) * -1); padding-left: var(--gutter); padding-right: var(--gutter); }
  .action-bar { flex-wrap: nowrap; } .action-group { flex-wrap: nowrap; gap: 6px; }
  .action-group .btn span { display: none; } .action-group .btn { width: 44px; padding: 0; }
  .action-bar > .btn-xl { flex: 1; min-width: 0; padding: 0 14px; font-size: 16px; }
  #pr-notes span { display: none; } #pr-notes { width: 44px; padding: 0; }
  .btn-xl { min-height: 52px; }
  /* Free table: the shot button stays reachable while the controls scroll. */
  #view-free { padding-bottom: calc(var(--tabbar) + 84px); }
  #view-free .shoot { position: fixed; left: var(--gutter); right: var(--gutter); bottom: calc(var(--tabbar) + 10px); z-index: 25; min-height: 58px; flex-direction: row; box-shadow: 0 12px 30px #000b; grid-column: auto; }

<script>
(function (root) {
  'use strict';
  const Coach = root.Coach = root.Coach || {};
  const R = 0.02625;
  const TABLE = Object.freeze({
    width: 3.569, height: 1.778, radius: R, mass: 0.142,
    baulk: 0.737, dRadius: 0.292, blackOffset: 0.324,
    // Simplified circular capture regions, not WPBSA pocket templates.
    pockets: Object.freeze([
      { id: 'TL', x: 0, y: 0, radius: 0.0445 },
      { id: 'TM', x: 1.7845, y: 0, radius: 0.051 },
      { id: 'TR', x: 3.569, y: 0, radius: 0.0445 },
      { id: 'BL', x: 0, y: 1.778, radius: 0.0445 },
      { id: 'BM', x: 1.7845, y: 1.778, radius: 0.051 },
      { id: 'BR', x: 3.569, y: 1.778, radius: 0.0445 }
    ])
  });
  const DEFAULTS = Object.freeze({
    muSlide: 0.20, muRoll: 0.011, cushionRestitution: 0.98,
    cushionFriction: 0.14, ballRestitution: 0.94,
    spinDecay: 8, gravity: 9.81
  });
  const DT = 0.001;
  const EPS = 1e-10;
  const STOP = 1e-5;
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const copyBall = b => ({ ...b });
  function createBall(b) {
    return {
      id: b.id || 'cue', color: b.color || 'white', x: b.x, y: b.y,
      vx: b.vx || 0, vy: b.vy || 0, wx: b.wx || 0, wy: b.wy || 0,
      wz: b.wz || 0, potted: !!b.potted
    };
  }
  function createWorld(balls, params = DEFAULTS) {
    return { balls: balls.map(createBall), params: { ...DEFAULTS, ...params }, time: 0, events: [], shot: null, _sanitized: false };
  }
  // x right, y down. The algebraic angular-velocity coordinates obey
  // u=(vx-R*wy, vy+R*wx); pure rolling has (wx,wy)=(-vy/R,vx/R).
  function slip(b) { return { x: b.vx - R * b.wy, y: b.vy + R * b.wx }; }
  function energy(b) {
    const I = 0.4 * TABLE.mass * R * R;
    return 0.5 * TABLE.mass * (b.vx * b.vx + b.vy * b.vy) +
      0.5 * I * (b.wx * b.wx + b.wy * b.wy + b.wz * b.wz);
  }
  function strike(world, shot) {
    const cue = world.balls.find(b => b.id === 'cue') || world.balls.find(b => b.color === 'white');
    if (!cue || cue.potted) throw new Error('Put the cue ball back on the table first.');
    if (isMoving(world)) throw new Error('Wait for all balls to stop.');
    let top = Number(shot.top) || 0, side = Number(shot.side) || 0;
    const offset = Math.hypot(top, side);
    if (offset > 0.5 + 1e-9) throw new RangeError('Combined tip offset must not exceed 0.5R.');
    const cueSpeed = Number(shot.cueSpeed);
    if (!Number.isFinite(cueSpeed) || cueSpeed < 0 || cueSpeed > 6) throw new RangeError('Cue speed must be between 0 and 6 m/s.');
    const angle = Number(shot.angle) || 0, a = angle * Math.PI / 180;
    // Ideal horizontal impulse from a 0.50 kg cue, tip restitution 0.75.
    // The off-centre term is the sphere's rotational effective mass.
    // v_ball = (1+e_tip)*v_cue / (1+m_ball/m_cue+2.5*(b/R)^2).
    const speed = 1.75 * cueSpeed / (1 + TABLE.mass / 0.5 + 2.5 * (top * top + side * side));
    cue.vx = speed * Math.cos(a); cue.vy = speed * Math.sin(a);
    cue.wx = -2.5 * top * cue.vy / R;
    cue.wy = 2.5 * top * cue.vx / R;
    cue.wz = -2.5 * side * speed / R;
    world.shot = { angle, cueSpeed, top, side, initialBallSpeed: speed };
    return world.shot;
  }
  function stopHorizontal(b) { b.vx = b.vy = b.wx = b.wy = 0; }
  function advanceFree(b, duration, p) {
    if (b.potted) return;
    if (b.vx === 0 && b.vy === 0 && b.wx === 0 && b.wy === 0 && b.wz === 0) return;
    let remaining = duration;
    const u = slip(b), magnitude = Math.hypot(u.x, u.y);
    const slideAcceleration = Math.max(0, p.muSlide) * p.gravity;
    if (magnitude > EPS && slideAcceleration > 0) {
      const transition = magnitude / (3.5 * slideAcceleration);
      const h = Math.min(remaining, transition);
      const ax = -slideAcceleration * u.x / magnitude;
      const ay = -slideAcceleration * u.y / magnitude;
      b.x += b.vx * h + 0.5 * ax * h * h;
      b.y += b.vy * h + 0.5 * ay * h * h;
      b.vx += ax * h; b.vy += ay * h;
      b.wx += 2.5 * ay * h / R;
      b.wy -= 2.5 * ax * h / R;
      remaining -= h;
      if (h >= transition - 1e-14) { b.wx = -b.vy / R; b.wy = b.vx / R; }
    } else if (magnitude > EPS) {
      // Zero-friction diagnostic case: never force a rolling transition.
      b.x += b.vx * remaining; b.y += b.vy * remaining; remaining = 0;
    }
    if (remaining > 0) {
      const speed = Math.hypot(b.vx, b.vy), deceleration = Math.max(0, p.muRoll) * p.gravity;
      if (speed > EPS) {
        const h = deceleration > 0 ? Math.min(remaining, speed / deceleration) : remaining;
        const travel = speed * h - 0.5 * deceleration * h * h;
        b.x += travel * b.vx / speed; b.y += travel * b.vy / speed;
        const nextSpeed = Math.max(0, speed - deceleration * h);
        b.vx *= nextSpeed / speed; b.vy *= nextSpeed / speed;
        b.wx = -b.vy / R; b.wy = b.vx / R;
      } else { stopHorizontal(b); }
    }
    if (Math.hypot(b.vx, b.vy) < STOP && Math.hypot(slip(b).x, slip(b).y) < STOP) stopHorizontal(b);
    const spinChange = Math.max(0, p.spinDecay) * duration;
    b.wz = Math.sign(b.wz) * Math.max(0, Math.abs(b.wz) - spinChange);
  }
  // Mathavan, Jackson & Parkin (2010), Eqs. (3), (4), (12)-(14), (16).
  // Local x is along the rail; y points INTO it. z is the algebraic vertical.
  // Integrate normal impulse / mass, with the nose 1.4R above the bed.
  // Compression stores work; restitution returns e^2 of that work. This e is
  // energetic restitution, NOT a multiplier on horizontal normal velocity.
  function cushionImpulse(b, nx, ny, p, subdivisions = 512) {
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return false;
    const tx = -ny, ty = nx;
    const s = .4, c = Math.sqrt(1 - s * s);
    const mu = clamp(p.cushionFriction ?? DEFAULTS.cushionFriction, 0, .3);
    const cloth = clamp(p.muSlide, 0, .35), e = clamp(p.cushionRestitution, 0, 1);
    // Angular components are stored here as surface speeds R*omega.
    let v = [b.vx * tx + b.vy * ty, -vn,
      R * (b.wx * tx + b.wy * ty), -R * (b.wx * nx + b.wy * ny), R * b.wz];
    const steps = Math.max(32, Math.min(16384, Math.floor(subdivisions) || 512));
    const dj = -vn / (c * steps);
    function increment(start, j) {
      let [x, y, wx, wy, wz] = start;
      const half = c * j / 2;
      // Symmetric normal/friction split. Accumulate exact normal work in
      // both half kicks; friction only dissipates the intervening energy.
      let work = half * (y - half / 2);
      y -= half;
      const ux = x + s * wy - c * wz, uq = -s * y + wx;
      const slip = Math.hypot(ux, uq);
      // The 1/6 bound regularises sticking without reversing contact slip.
      // 6 exceeds the largest eigenvalue of the two-contact inverse-mass
      // matrix for h=1.4R; the coupled friction kick is passive.
      const grip = slip > 0 ? Math.min(mu * j / slip, 1 / 6) : 0;
      const jx = -ux * grip, jq = -uq * grip;
      const bedNormal = Math.max(0, s * j - c * jq);
      const hx = x - wy, hy = y + wx, bedSlip = Math.hypot(hx, hy);
      const bedGrip = bedSlip > 0 ? Math.min(cloth * bedNormal / bedSlip, 1 / 6) : 0;
      const jcx = -hx * bedGrip, jcy = -hy * bedGrip;
      x += jx + jcx; y += -s * jq + jcy;
      wx += 2.5 * (jq + jcy);
      wy += 2.5 * (s * jx - jcx);
      wz -= 2.5 * c * jx;
      work += half * (y - half / 2);
      y -= half;
      return { v: [x, y, wx, wy, wz], work };
    }
    let stored = 0;
    // Locate the end of compression within the last impulse interval.
    for (let i = 0; i < steps * 4 + 64; i++) {
      let step = increment(v, dj);
      if (step.v[1] <= 0) {
        let lo = 0, hi = dj;
        for (let k = 0; k < 32; k++) { const mid = (lo + hi) / 2; if (increment(v, mid).v[1] > 0) lo = mid; else hi = mid; }
        step = increment(v, (lo + hi) / 2);
        stored += step.work; v = step.v; break;
      }
      stored += step.work; v = step.v;
    }
    let remaining = e * e * stored;
    for (let i = 0; remaining > 1e-16 && i < steps * 4 + 64; i++) {
      let step = increment(v, dj);
      if (-step.work >= remaining) {
        let lo = 0, hi = dj;
        for (let k = 0; k < 32; k++) { const mid = (lo + hi) / 2; if (-increment(v, mid).work < remaining) lo = mid; else hi = mid; }
        step = increment(v, (lo + hi) / 2); v = step.v; remaining = 0;
      } else { remaining += step.work; v = step.v; }
    }
    b.vx = v[0] * tx - v[1] * nx; b.vy = v[0] * ty - v[1] * ny;
    b.wx = (v[2] * tx - v[3] * nx) / R; b.wy = (v[2] * ty - v[3] * ny) / R;
    b.wz = v[4] / R;
    return true;
  }
  function pocketAndRails(world, b, time) {
    if (b.potted) return;
    for (const pocket of TABLE.pockets) {
      if (Math.hypot(b.x - pocket.x, b.y - pocket.y) <= pocket.radius) {
        b.potted = true; stopHorizontal(b); b.wz = 0;
        world.events.push({ type: 'pocket', id: b.id, pocket: pocket.id, x: b.x, y: b.y, t: time });
        return;
      }
    }
    function hit(wall, nx, ny) {
      if (cushionImpulse(b, nx, ny, world.params))
        world.events.push({ type: 'cushion', id: b.id, wall, x: b.x, y: b.y, t: time });
    }
    if (b.x < R) { b.x = R; hit('left', 1, 0); }
    if (b.x > TABLE.width - R) { b.x = TABLE.width - R; hit('right', -1, 0); }
    if (b.y < R) { b.y = R; hit('top', 0, 1); }
    if (b.y > TABLE.height - R) { b.y = TABLE.height - R; hit('bottom', 0, -1); }
  }
  function collidePair(a, b, restitution) {
    let dx = b.x - a.x, dy = b.y - a.y;
    const square = dx * dx + dy * dy;
    if (square >= 4 * R * R - 1e-14) return null;
    const distance = Math.sqrt(square);
    const nx = distance > EPS ? dx / distance : 1, ny = distance > EPS ? dy / distance : 0;
    const penetration = 2 * R - distance;
    // Symmetric positional correction; no spurious change of momentum.
    const correction = (penetration + 1e-10) * 0.5;
    a.x -= nx * correction; a.y -= ny * correction;
    b.x += nx * correction; b.y += ny * correction;
    const closing = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (closing <= EPS) return null;

<script>
/* Shared interface plumbing: DOM helpers, icons, toasts, dialogs, settings and the screen router. */
(function (root) {
  'use strict';
  const Coach = root.Coach, P = Coach.physics;
  const $ = (selector, scope = document) => scope.querySelector(selector);
  const $$ = (selector, scope = document) => Array.from(scope.querySelectorAll(selector));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const clone = x => JSON.parse(JSON.stringify(x));
  const ui = { $, $$, esc, clamp, clone };

  // ---------- icons ----------
  ui.icon = (name, className = '') => `<svg class="icon ${className}" aria-hidden="true" focusable="false"><use href="#i-${name}"></use></svg>`;

  // ---------- toasts ----------
  let toastTimer = 0;
  ui.toast = function toast(message, options = {}) {
    const region = $('#toast-region');
    if (!region) return;
    region.innerHTML = `<div class="toast toast-${options.tone || 'info'}">${options.tone === 'good' ? ui.icon('check') : options.tone === 'warn' ? ui.icon('info') : ''}<span>${esc(message)}</span></div>`;
    region.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => region.classList.remove('show'), options.ms || 4200);
  };

  // ---------- storage and settings ----------
  function pickBackend() {
    try {
      const probe = '__ssc_probe__';
      root.localStorage.setItem(probe, '1'); root.localStorage.removeItem(probe);
      return root.localStorage;
    } catch {
      const memory = new Map();
      return { getItem: k => memory.has(k) ? memory.get(k) : null, setItem: (k, v) => memory.set(k, String(v)), removeItem: k => memory.delete(k) };
    }
  }
  ui.store = Coach.storeFactory.createStore(pickBackend(), () => ui.toast('Saving is unavailable in this browser. You can still practise, but progress will not be kept.', { tone: 'warn', ms: 6000 }));
  ui.settings = ui.store.settings();
  ui.tableParams = () => ({ ...P.DEFAULTS, ...ui.settings.params });
  ui.reducedMotion = () => ui.settings.reduceMotion === 'reduce' || (ui.settings.reduceMotion === 'auto' && typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
  ui.applySettings = function () {
    document.documentElement.dataset.motion = ui.reducedMotion() ? 'reduce' : 'full';
    Coach.sound.setEnabled(ui.settings.sound);
    Coach.renderer.config.colourLabels = ui.settings.colourLabels;
  };
  ui.saveSettings = function (patch) {
    ui.settings = ui.store.saveSettings(patch);
    ui.applySettings();
    return ui.settings;
  };

  // ---------- puzzles ----------
  // Built-in lessons followed by the learner's own, always in course order.
  ui.customPuzzles = function () {
    const saved = ui.store.customPuzzles(), valid = [];
    for (const p of saved.slice(0, 50)) { try { valid.push({ ...Coach.editor.validatePuzzle(p), recording: p.recording }); } catch { /* skip a damaged entry */ } }
    return valid;
  };
  ui.builtIn = () => Coach.puzzles || [];
  ui.allPuzzles = () => Coach.courses.order(ui.builtIn(), ui.customPuzzles());
  ui.puzzle = id => ui.allPuzzles().find(p => p.id === id) || null;

  // ---------- dialog ----------
  const dialogEl = () => $('#dialog');
  ui.dialog = {
    open(html, { label = '', wide = false, onClose } = {}) {
      const dlg = dialogEl();
      $('#dialog-body').innerHTML = html;
      dlg.classList.toggle('wide', wide);
      dlg.setAttribute('aria-label', label || 'Dialog');
      ui.dialog.onClose = onClose || null;
      if (!dlg.open) dlg.showModal();
      const first = $('[data-autofocus]', dlg) || $('h2', dlg);
      if (first) { if (!first.hasAttribute('tabindex') && !/^(BUTTON|INPUT|A)$/.test(first.tagName)) first.tabIndex = -1; first.focus({ preventScroll: true }); }
      return dlg;
    },
    close() { const dlg = dialogEl(); if (dlg.open) dlg.close(); },
    confirm({ title, body, confirmLabel, cancelLabel = 'Cancel', danger = false }) {
      return new Promise(resolve => {
        let answered = false;
        const done = value => { if (answered) return; answered = true; ui.dialog.close(); resolve(value); };
        ui.dialog.open(`<div class="confirm"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="button-row"><button class="btn btn-ghost" data-cancel>${esc(cancelLabel)}</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok data-autofocus>${esc(confirmLabel)}</button></div></div>`,
          { label: title, onClose: () => done(false) });
        $('[data-ok]', dialogEl()).onclick = () => done(true);
        $('[data-cancel]', dialogEl()).onclick = () => done(false);
      });
    }
  };

  // ---------- router ----------
  const views = new Map();
  let current = null;
  function parseHash() {
    const parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    return { name: parts[0] || 'home', params: parts.slice(1) };
  }
  ui.router = {
    register(view) { views.set(view.id, view); },
    go(path) { const target = '#/' + path; if (location.hash === target) ui.router.render(); else location.hash = target; },
    path() { return parseHash(); },
    render() {
      const { name, params } = parseHash();
      let view = views.get(name) || views.get('home');
      if (!views.has(name)) { history.replaceState(null, '', '#/home'); }
      if (current && current !== view) { current.leave?.(); current.el.hidden = true; }
      view.el.hidden = false;
      const previous = current;
      current = view;
      const ok = view.enter ? view.enter(params, { from: previous?.id }) : true;
      if (ok === false) { current = previous; view.el.hidden = true; if (previous) previous.el.hidden = false; ui.router.go('puzzles'); return; }
      $$('[data-nav]').forEach(link => { if (link.dataset.nav === view.nav) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current'); });
      document.title = (view.title?.() || 'Snooker Safety Coach') + ' · Snooker Safety Coach';
      if (previous !== view || params.join('/') !== view.lastParams) {
        window.scrollTo(0, 0);
        const heading = $('[data-focus]', view.el);
        if (heading) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); }
      }
      view.lastParams = params.join('/');
    },
    start() { root.addEventListener('hashchange', () => ui.router.render()); ui.router.render(); }
  };

  // State shared between screens in this visit.
  ui.session = { assessment: null, capture: null, drafts: new Map() };

  Coach.ui = ui;
})(globalThis);

</script>

(function (root) {

  const Coach = root.Coach, ui = Coach.ui, C = Coach.courses, { $, $$, esc, icon } = ui;
  const el = $('#view-puzzles');
  let filter = 'all', hideDone = false, renderers = [];

  const dots = level => `<span class="dots" role="img" aria-label="Difficulty ${level} of 5">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= level ? 'on' : ''}"></i>`).join('')}</span>`;
  const STATUS = {
    new: { text: 'New', icon: '' },
    tried: { text: 'Practising', icon: 'route' },
    promising: { text: 'Promising', icon: 'star' },
    mastered: { text: 'Mastered', icon: 'check' }
  };

  function card(p, number, status, isNext) {
    const tactic = C.tacticOf(p.tactic), s = STATUS[status];
    const tags = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const level = p.level ? `Level ${p.level}` : 'Your puzzle';
    return `<a class="puzzle-card" href="#/practice/${encodeURIComponent(p.id)}" data-status="${status}" aria-label="${esc(`${number ? 'Puzzle ' + number + ': ' : ''}${p.title}. ${level}. ${s.text}.${isNext ? ' Up next.' : ''}`)}">
      <div class="card-thumb"><canvas data-thumb="${esc(p.id)}" aria-hidden="true"></canvas>
        <span class="card-tactic">${icon(tactic.icon)}${esc(tactic.label)}</span>
        <span class="card-state state-${status}">${s.icon ? icon(s.icon) : ''}${s.text}</span>
        ${isNext ? '<span class="card-next">Up next</span>' : ''}</div>
      <div class="card-body"><h3>${number ? `<span class="card-number">${String(number).padStart(2, '0')}</span>` : ''}${esc(p.title)}</h3>
        <p>${esc(p.learn || p.brief || '')}</p>
        <div class="card-meta">${p.level ? dots(p.level) : ''}${tags}</div></div></a>`;
  }

  function render() {
    renderers.forEach(r => r.destroy());
    renderers = [];
    const builtIn = ui.builtIn(), custom = ui.customPuzzles(), progress = ui.store.progress();
    const statusOf = id => ui.store.statusOf(id, progress);
    const counts = C.counts(builtIn, statusOf), next = C.recommended(builtIn, statusOf);
