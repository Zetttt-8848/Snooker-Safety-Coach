  function onPointerUp(e) {
    try { renderer.canvas.releasePointerCapture(e.pointerId); } catch { /* not captured */ }
    if (editor.drawing) {
      const ok = editor.endStroke();
      if (!ok) ui.toast('Drag a longer line from the white ball.', { ms: 2600 });
      else Coach.sound.play('tick');
    } else if (editor.dragging > 0) editor.endDrag();
    cursor = '';
  }
  function onKeyDown(e) {
    if (busy) return;
    const step = e.shiftKey ? .005 : .001, moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (moves[e.key] && editor.selected > 0) { e.preventDefault(); editor.nudge(...moves[e.key]); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && editor.selected > 0) { e.preventDefault(); editor.removeSelected(); return; }
    if (e.key === 'Tab' && editor.hasRoute) { if (editor.stepSelection(e.shiftKey ? -1 : 1) > 0) e.preventDefault(); return; }
    if (e.key === 'Escape') { editor.select(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); check(); }
  }
  function onContextMenu(e) {
    e.preventDefault();
    if (busy || !editor.hasRoute) return;
    const handle = editor.hitHandle(renderer.unproject(e), .05);
    if (handle > 0) { editor.select(handle); editor.removeSelected(); }
  }

  // ---------- checking ----------
  function setBusy(value) {
    busy = value;
    $('#pr-checking').hidden = !value;
    $('#pr-check').classList.toggle('loading', value);
    if (value) { $('#pr-cancel').focus({ preventScroll: true }); }
    refresh();
  }

  async function check() {
    if (busy) return;
    if (!editor.hasRoute) { ui.toast('Draw a route from the white ball first.', { tone: 'warn' }); return; }
    controller = { aborted: false };
    const mine = controller;
    $('#pr-check-bar').style.width = '0%';
    $('#pr-check-title').textContent = 'Testing shots…';
    $('#pr-check-detail').textContent = 'Looking for a legal shot that matches your line.';
    setBusy(true);
    const route = clone(editor.points);
    try {
      const fit = await S.invert({
        puzzle, path: route, reference, params: P.DEFAULTS, maxEvaluations: 320, signal: mine,
        onProgress: ({ evaluations, maxEvaluations }) => {
          $('#pr-check-bar').style.width = Math.min(100, evaluations / maxEvaluations * 100) + '%';
          $('#pr-check-detail').textContent = `Shot ${evaluations} of up to ${maxEvaluations}`;
        }
      });
      if (mine.aborted) { ui.toast('Check cancelled. Your route is untouched.'); return; }
      if (fit.status === 'invalid') { ui.toast(fit.message, { tone: 'warn', ms: 6000 }); return; }
      const realized = fit.status === 'feasible' || fit.status === 'approximate' ? fit.result : null;
      const report = S.evaluate({ puzzle, studentPath: route, reference, realized, feasibility: fit });
      ui.store.recordAttempt(puzzle.id, report, !!realized);
      ui.session.assessment = { puzzleId: puzzle.id, route, reference, fit, report, at: Date.now() };
      ui.router.go('results');
    } catch (error) {
      ui.toast('The check could not finish: ' + error.message, { tone: 'warn', ms: 6000 });
    } finally {
      if (controller === mine) controller = null;
      setBusy(false);
    }
  }

  // ---------- loading a puzzle ----------
  function notes() {
    const p = puzzle, tactic = C.tacticOf(p.tactic);
    ui.dialog.open(`<div class="notes"><p class="eyebrow">${icon(tactic.icon)}${esc(tactic.label)}${p.level ? ' · Level ' + p.level : ''}</p><h2>${esc(p.title)}</h2>
      <dl class="notes-list">
        <div><dt>Your task</dt><dd>${esc(p.task)}</dd></div>
        <div><dt>What counts as success</dt><dd>${esc(p.goal)}</dd></div>
        <div><dt>What you will learn</dt><dd>${esc(p.learn || '')}</dd></div>
        <div><dt>Coach’s note</dt><dd>${esc(p.explanation)}</dd></div>
      </dl>
      <details class="soft"><summary>Keyboard controls</summary><ul class="plain"><li><kbd>Tab</kbd> steps through route points</li><li><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> move a point 1 mm (<kbd>Shift</kbd> for 5 mm)</li><li><kbd>Delete</kbd> removes the selected point</li><li><kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes, <kbd>Enter</kbd> checks</li></ul></details>
      <p class="source">Source: ${esc(p.source)}</p>
      <div class="button-row"><button class="btn btn-primary" data-autofocus data-close>Got it</button></div></div>`, { label: 'Coach notes' });
    $('#dialog [data-close]').onclick = () => ui.dialog.close();
  }

  function load(id) {
    const found = ui.puzzle(id);
    if (!found) { ui.toast('That puzzle is not available.', { tone: 'warn' }); return false; }
    puzzle = found;
    reference = referenceFor(puzzle);
    const cue = puzzle.balls.find(b => b.id === 'cue');
    editor = new RouteEditor({ start: { x: cue.x, y: cue.y }, balls: puzzle.balls.map(P.createBall), onChange: refresh });
    const draft = ui.session.drafts.get(puzzle.id);
    if (draft && draft.points.length) { editor.points = clone(draft.points); editor.selected = draft.selected; }
    hint = false; cursor = '';
    const tactic = C.tacticOf(puzzle.tactic), list = ui.allPuzzles(), index = listIndex();
    $('#pr-title').textContent = puzzle.title;
    $('#pr-level').textContent = puzzle.level ? `Level ${puzzle.level}` : 'Your puzzle';
    $('#pr-brief').textContent = puzzle.brief || puzzle.task;
    $('#pr-goal-icon').innerHTML = icon(tactic.icon);
    $('#pr-count').textContent = `${index + 1} / ${list.length}`;
    $('#pr-prev').disabled = index <= 0; $('#pr-next').disabled = index >= list.length - 1;
    $('#pr-hint').hidden = true;
    $('#pr-hintbtn').setAttribute('aria-pressed', 'false'); $('#pr-hintbtn span').textContent = 'Show hint'; $('#pr-hintbtn').setAttribute('aria-label', 'Show hint');
    return true;
  }

  function wire() {
    const canvas = $('#pr-canvas');
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('keydown', onKeyDown);
    canvas.addEventListener('contextmenu', onContextMenu);
    $('#pr-undo').onclick = () => editor.undo();
    $('#pr-redo').onclick = () => editor.redo();
    $('#pr-clear').onclick = () => { editor.clear(); ui.toast('Route cleared. Undo brings it back.'); };
    $('#pr-add').onclick = () => { if (editor.insertMidpoint() > 0) canvas.focus({ preventScroll: true }); };
    $('#pr-straight').onclick = () => { editor.starterRoute(puzzle.balls.find(b => b.id === puzzle.targetId)); };
    $('#pr-remove').onclick = () => { editor.removeSelected(); canvas.focus({ preventScroll: true }); };
    $('#pr-hintbtn').onclick = () => {
      hint = !hint;
      $('#pr-hintbtn').setAttribute('aria-pressed', String(hint));
      $('#pr-hintbtn span').textContent = hint ? 'Hide hint' : 'Show hint';
      $('#pr-hintbtn').setAttribute('aria-label', hint ? 'Hide hint' : 'Show hint');
      $('#pr-hint').hidden = !hint; $('#pr-hint span').textContent = puzzle.hint || '';
      refresh();
    };
    $('#pr-check').onclick = check;
    $('#pr-cancel').onclick = () => { if (controller) controller.aborted = true; };
    $('#pr-notes').onclick = notes;
    $('#pr-prev').onclick = () => { const l = ui.allPuzzles(), i = listIndex(); if (i > 0) ui.router.go('practice/' + encodeURIComponent(l[i - 1].id)); };
    $('#pr-next').onclick = () => { const l = ui.allPuzzles(), i = listIndex(); if (i < l.length - 1) ui.router.go('practice/' + encodeURIComponent(l[i + 1].id)); };
    document.addEventListener('keydown', e => {
      if (el.hidden || busy || !(e.ctrlKey || e.metaKey)) return;
      if (e.target.closest?.('input, textarea, select')) return;
      if (e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? editor.redo() : editor.undo(); }
      else if (e.key.toLowerCase() === 'y') { e.preventDefault(); editor.redo(); }
    });
    window.addEventListener('resize', () => { if (!el.hidden && puzzle) { placeBubble(); placeRemoveButton(); } });
  }

  let wired = false;
  ui.router.register({
    id: 'practice', nav: 'puzzles', el, title: () => puzzle ? puzzle.title : 'Practice',
    enter(params) {
      const id = params[0] || Coach.courses.recommended(ui.builtIn(), x => ui.store.statusOf(x))?.id;
      if (!renderer) renderer = new Coach.renderer.TableRenderer($('#pr-canvas'));
      if (!wired) { wire(); wired = true; }
      if (busy) return true;
      if (!puzzle || puzzle.id !== id) { if (!load(id)) return false; }
      renderer.resize();
      renderer.animate(true);
      placeBubble();
      refresh();
      return true;
    },
    leave() { if (controller) controller.aborted = true; renderer.animate(false); }
  });
  Coach.practice = { get editor() { return editor; }, get puzzle() { return puzzle; }, load };
})(globalThis);

</script>
<script>
/* Screen: what happened. Score, plain-language reasons, and a replay you can scrub. */
(function (root) {
  'use strict';
  const Coach = root.Coach, ui = Coach.ui, P = Coach.physics, G = Coach.geometry, R = Coach.replay, C = Coach.courses;
  const { $, $$, esc, icon, clamp } = ui;
  const el = $('#view-results');

  el.innerHTML = `
    <div class="results-head">
      <a class="back-link" id="rs-back" href="#/puzzles">${icon('arrow-left')}<span>Back to the puzzle</span></a>
      <h1 data-focus id="rs-title">Results</h1>
    </div>
    <div class="results-grid">
      <section class="results-stage" aria-label="Replay">
        <div class="table-frame"><canvas id="rs-canvas" aria-label="Table showing your route, the reference route and the replay of the shot"></canvas></div>
        <div class="replay-bar" role="group" aria-label="Replay controls">
          <div class="segmented" role="group" aria-label="Which shot to replay">
            <button type="button" id="rs-src-mine" aria-pressed="true">Your shot</button>
            <button type="button" id="rs-src-ref" aria-pressed="false">Reference shot</button>
          </div>
          <button class="btn btn-primary btn-round" id="rs-play" type="button" aria-label="Play">${icon('play')}</button>
          <button class="icon-btn" id="rs-restart" type="button" aria-label="Restart replay">${icon('restart')}</button>
          <button class="btn btn-ghost" id="rs-finish" type="button">Final leave</button>
          <div class="scrub">
            <input id="rs-scrub" type="range" min="0" max="1000" value="0" aria-label="Replay position">
            <div class="scrub-marks" id="rs-marks" aria-hidden="true"></div>
          </div>
          <output class="time" id="rs-time" aria-hidden="true">0.0 s</output>
          <div class="segmented small" role="group" aria-label="Replay speed" id="rs-speed"></div>
        </div>
        <p class="note-line" id="rs-note" hidden></p>
        <div class="chip-row layers" role="group" aria-label="Show on the table" id="rs-layers"></div>
        <div class="safe-legend" id="rs-safe-legend" hidden aria-live="polite"></div>
      </section>
      <section class="score-card score-summary" aria-label="Score summary">
        <div class="score-top">
          <div class="ring" id="rs-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-track" cx="60" cy="60" r="52"/><circle class="ring-fill" cx="60" cy="60" r="52"/></svg><div class="ring-text"><strong id="rs-total">0</strong><span>of 100</span></div></div>
          <div class="score-title"><p class="eyebrow" id="rs-puzzle"></p><h2 id="rs-grade"></h2><span class="pill" id="rs-verify"></span></div>
        </div>
        <p class="tip" id="rs-tip"></p>
        <div class="alt-badge" id="rs-alt" hidden>${icon('star')}<span>Alternative route recognised. It does not have to match the reference to count.</span></div>
        <div class="button-row">
          <button class="btn btn-primary btn-xl" id="rs-next" type="button"><span>Next puzzle</span>${icon('arrow-right')}</button>
          <button class="btn btn-ghost" id="rs-retry" type="button">${icon('restart')}<span>Try again</span></button>
        </div>
      </section>
      <section class="score-card score-detail" aria-label="Score details">
        <h2 class="detail-title">Why this score</h2>
        <ul class="meters" id="rs-meters"></ul>
        <p class="fine" id="rs-search"></p>
        <details class="soft"><summary>How this score works</summary><div id="rs-detail"></div></details>
      </section>
    </div>`;

  const METERS = [
    { key: 'O', name: 'Safety of the leave', weight: 45, icon: 'shield' },
    { key: 'E', name: 'Finish spot', weight: 25, icon: 'pin' },
    { key: 'P', name: 'Route shape', weight: 20, icon: 'route' },
    { key: 'C', name: 'Cushion contacts', weight: 10, icon: 'bounce' }
  ];
  const SPEEDS = [.25, .5, 1, 2];
  let renderer = null, data = null, player = null, source = 'mine', layers = {}, wired = false, markersFor = null;
  let safeMap = null;
  const safeMaps = new WeakMap();

  const tone = v => v >= .9 ? 'good' : v >= .6 ? 'mid' : 'low';
  const gradeLabel = { Excellent: 'Excellent', Promising: 'Promising', Developing: 'Developing' };

  function sources() {
    const mine = data.fit.result || null;
    return { mine, ref: data.reference };
  }

  function tableState(frame) {
    const { puzzle, route, reference, fit, report } = data, s = sources(), atEnd = player && player.time >= player.duration - 1e-6;
    const result = source === 'mine' && s.mine ? s.mine : s.ref;
    const now = frame || player.snapshot(), t = player ? player.time : 0;
    const state = { balls: now.balls, labels: [], rings: [] };
    if (layers.safe && atEnd && safeMap) {
      state.safeLeaves = safeMap;
      const cue = now.balls.find(b => b.id === 'cue' && !b.potted);
      if (cue && !safeMap.actual.safe && safeMap.nearest) {
        state.points = [{ at: safeMap.nearest, text: 'Lower exposure', tone: 'good', below: true }];
      }
    }
    if (layers.route) state.student = route;
    if (layers.reference) state.reference = reference.path;
    if (layers.zone) {
      const o = puzzle.objective || {};
      state.zones = [];
      if (o.cueZone) state.zones.push({ ...o.cueZone, label: 'Target area', tone: 'gold' });
      if (o.targetZone) state.zones.push({ ...o.targetZone, label: 'Safe area for the red', tone: 'good' });
    }
    if (layers.trails) state.trails = R.trailsAt(result, t, now);
    if (fit.status === 'unresolved' && fit.closest?.path) state.closest = fit.closest.path;
    if (layers.cone && atEnd) {
      const cue = now.balls.find(b => b.id === 'cue'), target = now.balls.find(b => b.id === puzzle.targetId);
      if (cue && target && !cue.potted && !target.potted) {
        const blockers = now.balls.filter(b => b.id !== 'cue' && !(puzzle.legalTargetIds || [puzzle.targetId]).includes(b.id) && !b.potted);
        const view = G.occlusion(cue, target, blockers);
        state.cone = { cue, target, view };
        if (view.valid) (state.points = state.points || []).push({ at: target, below: true, tone: view.blockedFraction >= .95 ? 'good' : 'warn',
          text: view.blockedFraction >= .95 ? 'Red is hidden' : `${Math.round(view.blockedFraction * 100)}% of the red hidden` });
      }
    }
    if (atEnd && layers.reference && source === 'mine' && s.mine) {
      const mineCue = s.mine.balls.find(b => b.id === 'cue'), refCue = s.ref.balls.find(b => b.id === 'cue');
      if (mineCue && refCue) {
        state.gap = { from: refCue, to: mineCue };
        state.points = [...(state.points || []), { at: refCue, text: 'Reference finish', tone: 'gold', below: true }, { at: mineCue, text: 'Your finish', tone: 'info' }];
        if (state.zones) state.zones.forEach(z => { delete z.label; });
      }
    }
    return state;
  }

  function draw(frame) {
    renderer.draw(tableState(frame));
    const legend = $('#rs-safe-legend'), atEnd = player && player.time >= player.duration - 1e-6;
    legend.hidden = !layers.safe || !atEnd || !safeMap;
    if (!legend.hidden) {
      const name = source === 'mine' ? 'Your final layout' : 'Reference final layout';
      legend.innerHTML = `<div><span class="safe-key">Low exposure</span><span class="safe-key hidden-key">95%+ hidden</span></div>
        <p>${name} · ${safeMap.targetCount} legal target${safeMap.targetCount === 1 ? '' : 's'} · ${safeMap.actual.valid ? (safeMap.actual.safe ? 'The white finishes in a low-exposure area.' : 'Try a highlighted landing area.') : 'No valid cue-ball finish.'}</p>
        <small>${!safeMap.safeCount ? 'No qualifying area found at this resolution. ' : ''}Paper exposure ≤ 0.30, sampled every 2 cm. Geometry only; reaching these positions needs a legal shot.</small>`;
    }
  }

  function updateTransport() {
    const playing = !!player && player.playing, atEnd = player && player.time >= player.duration - 1e-6;
    const button = $('#rs-play');
    button.innerHTML = icon(playing ? 'pause' : 'play');
    button.setAttribute('aria-label', playing ? 'Pause' : atEnd ? 'Replay' : 'Play');
    if (player) {
      $('#rs-scrub').value = player.duration ? Math.round(player.time / player.duration * 1000) : 0;
      $('#rs-time').textContent = `${player.time.toFixed(1)} s`;
    }
  }

  function choose(which) {
    const s = sources(), result = which === 'mine' && s.mine ? s.mine : s.ref;
    source = which === 'mine' && s.mine ? 'mine' : 'ref';
    if (result.completed) {
      if (!safeMaps.has(result)) safeMaps.set(result, Coach.safeLeaves.analyse(result.balls, data.puzzle.legalTargetIds || [data.puzzle.targetId]));
      safeMap = safeMaps.get(result);
    } else safeMap = null;
    $('#rs-src-mine').setAttribute('aria-pressed', String(source === 'mine'));
    $('#rs-src-ref').setAttribute('aria-pressed', String(source === 'ref'));
    if (player) player.dispose();
    player = new R.Player(result, {
      speed: ui.settings.replaySpeed,
      onFrame: frame => { draw(frame); updateTransport(); },
      onEvent: e => {
        if (e.kind === 'ball') Coach.sound.play('ball', Math.min(1, e.strength / .25));
        else if (e.kind === 'cushion') Coach.sound.play('cushion');
        else Coach.sound.play('pocket');
      },
      onEnd: () => { draw(); updateTransport(); }
    });
    markersFor = R.markers(result);
    $('#rs-marks').innerHTML = markersFor.map(m => `<i class="mark ${m.kind}" style="left:${m.t / (player.duration || 1) * 100}%"></i>`).join('');
    updateTransport();
  }

  function play(restart) {
    if (!player) return;
    if (restart || player.time >= player.duration - 1e-6) player.seek(0);
    Coach.sound.play('shot');
    player.play(); updateTransport();
  }

  function layerChips() {
    const defs = [
      ['route', 'Your drawn route', 'route', true], ['reference', 'Reference route', 'route', true],
      ['safe', 'Safe leaves', 'shield', true], ['zone', 'Target area', 'target', true], ['trails', 'Ball trails', 'play', true]
    ];
    if (data.puzzle.tactic === 'hide') defs.push(['cone', 'Blocked view', 'eye-off', true]);
    $('#rs-layers').innerHTML = defs.map(([key, label, ic]) => `<button type="button" class="chip layer-${key}" aria-pressed="${!!layers[key]}" data-layer="${key}">${icon(ic)}<span>${label}</span></button>`).join('');
    $$('[data-layer]', el).forEach(b => {
      b.onclick = () => {
        layers[b.dataset.layer] = !layers[b.dataset.layer]; b.setAttribute('aria-pressed', String(layers[b.dataset.layer]));
        if (b.dataset.layer === 'safe' && layers.safe && player) { player.pause(); player.seek(player.duration); updateTransport(); }
        draw();
      };
    });
  }

  function fill() {
    const { puzzle, report, fit } = data;
    const verification = report.verification;
    $('#rs-title').textContent = 'Your result';
    $('#rs-puzzle').textContent = puzzle.title;
    $('#rs-grade').textContent = gradeLabel[report.grade];
    $('#rs-ring').dataset.grade = report.grade;
    const pill = $('#rs-verify');
    pill.className = 'pill ' + ({ verified: 'good', approximate: 'info', estimate: 'warn' }[verification]);
    pill.innerHTML = {
      verified: icon('check') + 'Verified on the physics table',
      approximate: icon('check') + 'Closest legal shot played',
      estimate: icon('info') + 'Estimate: no matching shot found'
    }[verification];
    $('#rs-tip').innerHTML = `<span class="tip-label">${report.grade === 'Developing' || !report.diagnostics.legality.valid ? 'Try this next' : 'Coach'}</span>${esc(report.headline)}`;
    $('#rs-alt').hidden = !report.alternative;
    $('#rs-meters').innerHTML = METERS.map(m => `<li class="meter-row ${tone(report[m.key])}">
        <div class="meter-top"><span class="meter-name">${icon(m.icon)}${m.name}<small>${m.weight}%</small></span><strong>${Math.round(report[m.key] * 100)}</strong></div>
        <div class="meter"><i style="width:${Math.round(report[m.key] * 100)}%"></i></div>
        <p>${esc(report.explain[m.key])}</p></li>`).join('');
    $('#rs-search').textContent = fit.status === 'feasible' ? '' : fit.message;
    $('#rs-search').hidden = fit.status === 'feasible';
    const d = report.diagnostics, a = report.outcome.actual, ref = report.outcome.reference;
    const rows = [];
    if (a && a.valid !== false) {
      rows.push(['Share of the red’s directions blocked', `${(a.blockedFraction * 100).toFixed(0)}% (reference ${(ref.blockedFraction * 100).toFixed(0)}%)`]);
      rows.push(['Blocked angle', `${a.deltaDegrees.toFixed(1)}° (reference ${ref.deltaDegrees.toFixed(1)}°)`]);
      rows.push(['Gap between the white and a cushion', `${(a.cueRailDistance * 100).toFixed(1)} cm`]);
      rows.push(['Direct-line exposure of the red', a.exposure.toFixed(2)]);
    }
    rows.push(['Finish error', `${(d.endpointDistance * 100).toFixed(1)} cm`]);
    if (fit.shot) rows.push([fit.status === 'unresolved' ? 'Closest shot tried (unverified)' : 'Shot played', `${fit.shot.cueSpeed.toFixed(2)} m/s · ${fit.shot.angle.toFixed(1)}° · top/back ${fit.shot.top.toFixed(2)} · side ${fit.shot.side.toFixed(2)}`]);
    $('#rs-detail').innerHTML = `<p>Total = 45% safety of the leave + 25% finish spot + 20% route shape + 10% cushion contacts.</p>
      <ul class="plain"><li><b>Excellent</b>: finish and safety at 90% or better, route 85%, cushions 80%.</li><li><b>Promising</b>: a different route that still leaves the red safe.</li><li><b>Developing</b>: the next step is always shown first.</li></ul>
      <dl class="facts">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      <p class="fine">A reference shot is one good answer, not the only one. A failed search never proves a route is impossible.</p>
      <p class="fine">Safe leaves hold the selected replay’s final object balls fixed. For each possible white-ball position, the map takes the largest Eq. (37) exposure over all legal targets and applies the paper’s Eq. (38) threshold of 0.30. Purple uses the approved occlusion-angle teaching extension. This does not calculate the paper’s certified return probabilities, shot reachability, potting risk or match value.</p>
      <ul class="plain">${report.feedback.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
    // Score ring and count-up.
    const fillCircle = $('.ring-fill', el), circumference = 2 * Math.PI * 52, value = clamp(report.total, 0, 100);
    fillCircle.style.strokeDasharray = circumference;
    const total = $('#rs-total');
    if (ui.reducedMotion()) { fillCircle.style.strokeDashoffset = circumference * (1 - value / 100); total.textContent = Math.round(value); }
    else {
      fillCircle.style.strokeDashoffset = circumference; total.textContent = '0';
      const start = performance.now();
      requestAnimationFrame(() => { fillCircle.style.strokeDashoffset = circumference * (1 - value / 100); });
      const tick = now => { const f = Math.min(1, (now - start) / 900); total.textContent = Math.round(value * (1 - Math.pow(1 - f, 3))); if (f < 1 && !el.hidden) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
    const list = ui.allPuzzles(), next = C.neighbours(list, puzzle.id).next;
    $('#rs-next').hidden = !next;
    $('#rs-next span').textContent = next ? `Next: ${next.title}` : 'Next puzzle';
    // Move on when the puzzle is mastered; otherwise the best next step is another attempt.
    const mastered = report.grade === 'Excellent';
    $('#rs-next').className = 'btn btn-xl ' + (mastered ? 'btn-primary' : 'btn-ghost');
    $('#rs-retry').className = 'btn ' + (mastered ? 'btn-ghost' : 'btn-primary btn-xl');
    $('#rs-next').onclick = () => ui.router.go('practice/' + encodeURIComponent(next.id));
    $('#rs-retry').onclick = () => ui.router.go('practice/' + encodeURIComponent(puzzle.id));
    $('#rs-back').href = '#/practice/' + encodeURIComponent(puzzle.id);
    if (report.grade === 'Excellent') Coach.sound.play('success');
  }

  function wire() {
    $('#rs-play').onclick = () => { if (player.playing) { player.pause(); updateTransport(); } else play(false); };
    $('#rs-restart').onclick = () => { player.pause(); play(true); };
    $('#rs-finish').onclick = () => { player.pause(); player.seek(player.duration); updateTransport(); };
    $('#rs-src-mine').onclick = () => { choose('mine'); play(true); };
    $('#rs-src-ref').onclick = () => { choose('ref'); play(true); };
    $('#rs-scrub').oninput = e => { player.pause(); player.seek(Number(e.target.value) / 1000 * player.duration); updateTransport(); };
    $('#rs-speed').innerHTML = SPEEDS.map(v => `<button type="button" data-speed="${v}" aria-pressed="${v === ui.settings.replaySpeed}">${v}×</button>`).join('');
    $$('[data-speed]', el).forEach(b => b.onclick = () => {
      const speed = Number(b.dataset.speed);
      ui.saveSettings({ replaySpeed: speed });
      player?.setSpeed(speed);
      $$('[data-speed]', el).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    });
    $('#rs-canvas').addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); $('#rs-play').click(); }
    });
  }

  ui.router.register({
    id: 'results', nav: 'puzzles', el, title: () => 'Results',
    enter() {
      const assessment = ui.session.assessment;
      if (!assessment) { ui.toast('Check a route first to see its results.'); return false; }
      if (!renderer) { renderer = new Coach.renderer.TableRenderer($('#rs-canvas')); wire(); }
      if (data === assessment) { renderer.resize(); draw(); return true; }
      data = assessment;
      layers = { route: true, reference: true, zone: false, trails: true, safe: true, cone: false };
      data.puzzle = ui.puzzle(assessment.puzzleId);
      renderer.resize();
      fill();
      layerChips();
      const mine = !!data.fit.result;
      $('#rs-src-mine').disabled = !mine;
      $('#rs-src-mine').title = mine ? '' : 'Your route could not be matched to a legal shot, so there is nothing to replay.';
      const note = $('#rs-note');
      note.hidden = mine;
      note.innerHTML = mine ? '' : icon('info') + 'No legal shot matched your line, so only the reference can be replayed.';
      choose(mine ? 'mine' : 'ref');
      if (ui.reducedMotion()) { player.seek(player.duration); updateTransport(); draw(); }
      else { draw(); play(true); }
      return true;
    },
    leave() { if (player) { player.pause(); } }
  });
})(globalThis);

    </div>

      <section class="dock-card wide" aria-labelledby="ft-arr-h">

          <button class="btn btn-ghost" id="ft-remove" type="button">${icon('trash')}<span>Remove selected ball</span></button>
          <button class="btn btn-ghost" data-layout="pair" type="button"><span>Two balls</span></button>
          <button class="btn btn-ghost" data-layout="colours" type="button"><span>Colours on spots</span></button>
          <button class="btn btn-ghost" data-layout="frame" type="button"><span>Full frame</span></button>
          <span class="grow"></span>
          <button class="btn btn-primary" id="ft-done" type="button">${icon('check')}<span>Done arranging</span></button>
        </div>
      </section>
    </div>
    </div></div>`;

  // ---------- layouts ----------
  const ball = (id, color, x, y) => ({ id, color, x, y });
  const SPOTS = { yellow: [.737, 1.181], green: [.737, .597], brown: [.737, .889], blue: [1.7845, .889], pink: [2.67675, .889], black: [3.245, .889] };
  function layout(kind) {
    const list = [];
    if (kind === 'pair') return [ball('cue', 'white', .9, .889), ball('red1', 'red', 2.2, .75)].map(P.createBall);
    list.push(ball('cue', 'white', .57, .99));
    for (const [color, [x, y]] of Object.entries(SPOTS)) list.push(ball(color, color, x, y));
    if (kind === 'colours') list.push(ball('red1', 'red', 2.2, .75), ball('red2', 'red', 2.6, 1.2));
    else for (let row = 0, id = 1; row < 5; row++) for (let j = 0; j <= row; j++, id++) list.push(ball('red' + id, 'red', 2.733 + row * .0459, .889 + (j - row / 2) * .053));
    return list.map(P.createBall);
  }

  // ---------- state ----------
  const S = { balls: layout('colours'), before: null, shot: { angle: -20, cueSpeed: 1.5, top: 0, side: 0 }, last: null, mode: 'aim', selected: null, drag: null, aiming: false, prediction: null, player: null, playing: false, summary: null };
  S.before = clone(S.balls);
  let renderer = null, spinCtx = null, predictTimer = 0, wired = false, spinDrag = false;
  let safetyMap = null, reviewingSafety = false;

  // Pointer capture can fail for synthetic or already-released pointers; aiming still works without it.
  const capture = (el, id) => { try { el.setPointerCapture(id); } catch { /* not capturable */ } };
  const cue = () => S.balls.find(b => b.id === 'cue' && !b.potted);
  const canReviewSafety = () => !S.playing && S.mode === 'aim' && S.last?.completed &&
    S.balls.length === S.last.balls.length && S.balls.every(b => S.last.balls.some(f => f.id === b.id && f.x === b.x && f.y === b.y && f.potted === b.potted)) &&
    S.balls.some(b => b.color === 'red' && !b.potted);
  const names = { white: 'White', red: 'Red', yellow: 'Yellow', green: 'Green', brown: 'Brown', blue: 'Blue', pink: 'Pink', black: 'Black' };

  function describeSpin(top, side) {
    const r = Math.hypot(top, side);
    if (r < .04) return 'Centre ball';
    const vertical = Math.abs(top) > Math.abs(side) * .5 ? (top > 0 ? 'Top' : 'Back') : '';
    const horizontal = Math.abs(side) > Math.abs(top) * .5 ? (side > 0 ? 'right' : 'left') : '';
    const text = [vertical, horizontal].filter(Boolean).join(' + ');
    return `${text.charAt(0).toUpperCase()}${text.slice(1)} spin`.replace('Back spin', 'Backspin').replace('Top spin', 'Topspin');
  }

  function aimPreview() {
    const c = cue();
    if (!c || S.mode !== 'aim') return null;
    return G.aimPreview(S.balls, 'cue', S.shot.angle);
  }

  function draw() {
    if (!renderer) return;
    const aim = S.mode === 'aim' && !S.playing, c = cue();
    const state = { balls: S.balls, selectedId: S.mode === 'arrange' ? S.selected : null };
    const review = reviewingSafety && safetyMap && !S.playing && S.mode === 'aim';
    if (review) state.safeLeaves = safetyMap;
    if (aim && !review && ui.settings.aimGuide) state.aim = aimPreview();
    if (aim && c && !review) state.stick = { cue: c, angle: S.shot.angle, pull: clamp(S.shot.cueSpeed / 6, 0, 1) };
    if (aim && !review && ui.settings.predict && S.prediction) state.predicted = S.prediction;
    $('#ft-safe-legend').hidden = !review;
    if (S.playing && S.player) state.trails = R.trailsAt(S.player.result, S.player.time, S.player.snapshot());
    renderer.draw(state);
    const readout = $('#ft-readout');
    if (aim && c) {
      const at = renderer.toPage(c);
      readout.hidden = false; readout.textContent = `${S.shot.angle.toFixed(1)}°`;
      readout.style.left = (at.x + 22) + 'px'; readout.style.top = (at.y - 38) + 'px';
    } else readout.hidden = true;
  }

  function schedulePrediction() {
    clearTimeout(predictTimer);
    if (!ui.settings.predict || S.mode !== 'aim' || S.playing || !cue()) { S.prediction = null; draw(); return; }
    predictTimer = setTimeout(() => {
      try { S.prediction = P.simulate(S.balls, S.shot, ui.tableParams(), { recordFrames: false, maxTime: 12 }).path; } catch { S.prediction = null; }
      draw();
    }, 70);
  }

  function drawSpin() {
    const c = spinCtx, size = 132, r = 56, mid = size / 2;
    c.clearRect(0, 0, size, size);
    const g = c.createRadialGradient(mid - 18, mid - 20, 4, mid, mid, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9cfbd');
    c.fillStyle = g; c.beginPath(); c.arc(mid, mid, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(30,50,40,.35)'; c.lineWidth = 1; c.stroke();
    c.setLineDash([3, 4]); c.beginPath(); c.arc(mid, mid, r * .5, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.moveTo(mid - r, mid); c.lineTo(mid + r, mid); c.moveTo(mid, mid - r); c.lineTo(mid, mid + r); c.stroke();
    c.fillStyle = 'rgba(30,50,40,.55)'; c.font = '600 10px "Segoe UI", system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('TOP', mid, mid - r + 11); c.fillText('BACK', mid, mid + r - 11); c.fillText('L', mid - r + 9, mid); c.fillText('R', mid + r - 9, mid);
    const dx = mid + S.shot.side / .5 * (r * .5), dy = mid - S.shot.top / .5 * (r * .5);
    c.fillStyle = '#1b6a50'; c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.arc(dx, dy, 8, 0, Math.PI * 2); c.fill(); c.stroke();
    $('#ft-spin-label').textContent = describeSpin(S.shot.top, S.shot.side);
  }

  function syncControls() {
    $('#ft-angle').value = S.shot.angle.toFixed(1);
    $('#ft-power').value = S.shot.cueSpeed;
    $('#ft-power-out').textContent = `${S.shot.cueSpeed.toFixed(2)} m/s`;
    $$('[data-power]', el).forEach(b => b.setAttribute('aria-pressed', String(Math.abs(Number(b.dataset.power) - S.shot.cueSpeed) < .001)));
    $$('[data-spin]', el).forEach(b => { const [t, s] = b.dataset.spin.split(',').map(Number); b.setAttribute('aria-pressed', String(Math.abs(t - S.shot.top) < .001 && Math.abs(s - S.shot.side) < .001)); });
    drawSpin();
    $('#ft-guide').checked = ui.settings.aimGuide; $('#ft-predict').checked = ui.settings.predict;
    const busy = S.playing;
    $('#ft-shoot').disabled = busy || !cue() || S.mode !== 'aim';
    $('#ft-replay').disabled = busy || !S.last;
    $('#ft-undo').disabled = busy || !S.last;
    $('#ft-save').disabled = busy || !S.last;
    $('#ft-safety').disabled = !canReviewSafety();
    $('#ft-safety').setAttribute('aria-pressed', String(reviewingSafety));
    $('#ft-save').title = S.last ? '' : 'Take a shot first, then save it as a puzzle.';
    $('#ft-summary').innerHTML = S.summary || (S.mode === 'aim' ? `<span class="chip-static">${icon('target')}Drag on the table to aim. Press Space to take the shot.</span>` : `<span class="chip-static">${icon('table')}Drag a ball to move it.</span>`);
  }
  function update() { syncControls(); draw(); schedulePrediction(); }

  // ---------- shots ----------
  function summarise(result, before) {
    const first = result.events.find(e => e.type === 'ball' && e.ids.includes('cue')), cushions = result.events.filter(e => e.type === 'cushion' && e.id === 'cue').length;
    const potted = result.balls.filter(b => b.potted && !before.find(o => o.id === b.id)?.potted);
    const chips = [];
    if (first) { const id = first.ids.find(x => x !== 'cue'), b = before.find(o => o.id === id); chips.push(`<span class="chip-static">${icon('check')}First hit: ${esc((names[b?.color] || id).toLowerCase())}</span>`); }
    else chips.push(`<span class="chip-static warn">${icon('info')}The white hit nothing</span>`);
    chips.push(`<span class="chip-static">${icon('bounce')}${cushions} cushion${cushions === 1 ? '' : 's'}</span>`);
    for (const b of potted) {
      const isCue = b.id === 'cue';
      chips.push(`<span class="chip-static ${isCue ? 'bad' : 'good'}">${icon(isCue ? 'info' : 'target')}${isCue ? 'White potted (a foul)' : esc(names[b.color]) + ' potted'}</span>`);
    }
    if (!result.completed) chips.push(`<span class="chip-static warn">${icon('info')}Some balls were still moving at the time limit</span>`);
    return chips.join('');
  }

  function stopPlayback() { if (S.player) S.player.dispose(); S.playing = false; S.player = null; }
  function playResult(result, announce) {
    stopPlayback();
    reviewingSafety = false; safetyMap = null;
    S.summary = '';
    if (!result.frames?.length || !result.duration) { S.balls = clone(result.balls); update(); return; }
    S.playing = true;
    S.player = new R.Player(result, {
      speed: ui.settings.replaySpeed,
      onFrame: frame => { S.balls = frame.balls; draw(); },
      onEvent: e => { if (e.kind === 'ball') Coach.sound.play('ball', Math.min(1, e.strength / .25)); else if (e.kind === 'cushion') Coach.sound.play('cushion'); else Coach.sound.play('pocket'); },
      onEnd: () => {
        S.playing = false; S.balls = clone(result.balls);
        S.summary = summarise(result, S.before);
        S.player = null; update();
        if (announce) ui.toast('Shot complete. Check where both balls finished.', { ms: 2600 });
      }
    });
    Coach.sound.play('shot');
    S.player.play(); update();
  }

  function shoot() {
    if (S.playing || S.mode !== 'aim') return;
    if (!cue()) { ui.toast('Put the white ball back on the table first.', { tone: 'warn' }); return; }
    try {
      S.before = clone(S.balls).map(b => ({ ...b, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0 }));
      S.last = P.simulate(S.balls, S.shot, ui.tableParams());
      ui.session.capture = { initial: clone(S.before), shot: clone(S.last.shot), result: S.last };
      S.prediction = null;
      playResult(S.last, true);
    } catch (error) { ui.toast(error.message, { tone: 'warn' }); }
  }
  function restore(balls) { stopPlayback(); reviewingSafety = false; safetyMap = null; S.balls = clone(balls).map(b => ({ ...b, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0 })); S.summary = ''; update(); }

  // ---------- arranging ----------
  function safePosition(p, id) {
    const r = P.TABLE.radius;
    return p.x >= r && p.x <= P.TABLE.width - r && p.y >= r && p.y <= P.TABLE.height - r &&
      !P.TABLE.pockets.some(k => Math.hypot(p.x - k.x, p.y - k.y) < k.radius + r * .6) &&
      !S.balls.some(b => b.id !== id && !b.potted && Math.hypot(b.x - p.x, b.y - p.y) < 2 * r + .0005);
  }
  function addBall(color) {
    const existing = color !== 'red' && S.balls.find(b => b.color === color);
    if (existing && !existing.potted) { S.selected = existing.id; ui.toast(`${names[color]} selected. Drag it to move it.`, { ms: 2200 }); update(); return; }
    const id = color === 'white' ? 'cue' : color === 'red' ? 'red' + Date.now().toString(36) : color;
    let spot = null;
    for (let x = .45; x < 3.2 && !spot; x += .12) for (let y = .3; y < 1.5; y += .12) if (safePosition({ x, y })) { spot = { x, y }; break; }
    if (!spot) { ui.toast('There is no free space left for another ball.', { tone: 'warn' }); return; }
    if (existing) Object.assign(existing, P.createBall({ id: existing.id, color, ...spot }));
    else S.balls.push(P.createBall({ id, color, ...spot }));
    S.selected = existing?.id || id; S.last = null; S.summary = ''; S.before = clone(S.balls); update();
    renderPalette();
  }
  function renderPalette() {
    $('#ft-palette').innerHTML = Object.keys(Coach.renderer.colors).map(color => {
      const existing = color !== 'red' && S.balls.find(b => b.color === color), present = existing && !existing.potted;
      const label = existing?.potted ? `Restore the ${color} ball` : present ? `Select the ${color} ball` : `Add a ${color} ball`;
      return `<button type="button" class="palette-ball" data-color="${color}" aria-label="${label}" style="--ball:${Coach.renderer.colors[color]}"><i></i><span>${names[color]}</span>${present ? '<b aria-hidden="true">✓</b>' : ''}</button>`;
    }).join('');
    $$('[data-color]', el).forEach(b => b.onclick = () => addBall(b.dataset.color));
  }
  function setMode(mode) {
    if (S.playing) return;
    reviewingSafety = false; safetyMap = null;
    S.mode = mode;
    $('#ft-mode-aim').setAttribute('aria-pressed', String(mode === 'aim'));
    $('#ft-mode-arrange').setAttribute('aria-pressed', String(mode === 'arrange'));
    $('#ft-dock').hidden = mode !== 'aim'; $('#ft-arrange').hidden = mode !== 'arrange';
    if (mode === 'arrange') renderPalette(); else { S.selected = null; S.before = clone(S.balls); }
    update();
  }

  // ---------- input ----------
  function setAimFrom(e) {
    const c = cue();
    if (!c) return;
    const p = renderer.unproject(e);
    if (Math.hypot(p.x - c.x, p.y - c.y) < .02) return;
    S.shot.angle = Math.round(Math.atan2(p.y - c.y, p.x - c.x) * 1800 / Math.PI) / 10;
    syncControls(); draw(); schedulePrediction();
  }
  function onPointerDown(e) {
    if (S.playing || e.button > 0) return;
    const canvas = renderer.canvas;
    canvas.focus({ preventScroll: true });
    if (S.mode === 'aim') { S.aiming = true; capture(canvas, e.pointerId); setAimFrom(e); return; }
    const p = renderer.unproject(e), reach = e.pointerType === 'touch' ? .07 : .045;
    const hit = S.balls.filter(b => !b.potted).map(b => ({ b, d: Math.hypot(b.x - p.x, b.y - p.y) })).filter(x => x.d < reach).sort((a, b) => a.d - b.d)[0];
    S.selected = hit ? hit.b.id : null; S.drag = hit ? hit.b.id : null;
    if (hit) capture(canvas, e.pointerId);
    draw();
  }
  function onPointerMove(e) {
    if (S.aiming) { setAimFrom(e); return; }
    if (!S.drag) return;
    const p = renderer.unproject(e), b = S.balls.find(x => x.id === S.drag);
    if (b && safePosition(p, b.id)) { b.x = p.x; b.y = p.y; S.last = null; S.summary = ''; draw(); }
  }
  function onPointerUp() {
    if (S.drag) { S.before = clone(S.balls); S.drag = null; update(); }
    S.aiming = false;
  }
  function onKeyDown(e) {
    if (S.playing) return;
    if (S.mode === 'aim') {
      const fine = e.shiftKey ? 1 : .1;
      if (e.key === 'ArrowLeft') { e.preventDefault(); S.shot.angle = Math.round((S.shot.angle - fine) * 10) / 10; if (S.shot.angle < -180) S.shot.angle += 360; update(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); S.shot.angle = Math.round((S.shot.angle + fine) * 10) / 10; if (S.shot.angle > 180) S.shot.angle -= 360; update(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); S.shot.cueSpeed = clamp(Math.round((S.shot.cueSpeed + .05) * 100) / 100, .1, 6); update(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); S.shot.cueSpeed = clamp(Math.round((S.shot.cueSpeed - .05) * 100) / 100, .1, 6); update(); }
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); shoot(); }
    } else if ((e.key === 'Delete' || e.key === 'Backspace') && S.selected) { e.preventDefault(); $('#ft-remove').click(); }
  }

  function setSpin(top, side) {
    const r = Math.hypot(top, side);
    if (r > .5) { top *= .5 / r; side *= .5 / r; }
    // Rounding both components can move a valid diagonal tip point outside
    // the 0.5R circle and make the next shot throw. Round display, not state.
    S.shot.top = top; S.shot.side = side; update();
  }
  function spinFromEvent(e) {
    const rect = $('#ft-spin').getBoundingClientRect(), r = 56 * rect.width / 132;
    setSpin(-(e.clientY - rect.top - rect.height / 2) / r, (e.clientX - rect.left - rect.width / 2) / r);
  }

  function wire() {
    const canvas = $('#ft-canvas');
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('keydown', onKeyDown);
    $('#ft-mode-aim').onclick = () => setMode('aim');
    $('#ft-mode-arrange').onclick = () => setMode('arrange');
    $('#ft-done').onclick = () => setMode('aim');
    $('#ft-shoot').onclick = shoot;
    $('#ft-angle').oninput = e => {
      const v = Number(e.target.value);
      if (e.target.value !== '' && Number.isFinite(v)) { S.shot.angle = clamp(v, -180, 180); draw(); schedulePrediction(); }
    };
    $('#ft-angle').onchange = e => { const v = Number(e.target.value); S.shot.angle = Number.isFinite(v) ? clamp(Math.round(v * 10) / 10, -180, 180) : S.shot.angle; update(); };
    $$('[data-turn]', el).forEach(b => b.onclick = () => { S.shot.angle = Math.round(clamp(S.shot.angle + Number(b.dataset.turn), -180, 180) * 10) / 10; update(); });
    $('#ft-power').oninput = e => { S.shot.cueSpeed = Number(e.target.value); update(); };
    $$('[data-power]', el).forEach(b => b.onclick = () => { S.shot.cueSpeed = Number(b.dataset.power); update(); });
    $$('[data-spin]', el).forEach(b => b.onclick = () => { const [t, s] = b.dataset.spin.split(',').map(Number); setSpin(t, s); });
    const spin = $('#ft-spin');
    spinCtx = spin.getContext('2d');
    spin.onpointerdown = e => { spinDrag = true; capture(spin, e.pointerId); spinFromEvent(e); };
    spin.onpointermove = e => { if (spinDrag) spinFromEvent(e); };
    spin.onpointerup = () => { spinDrag = false; };
    spin.onpointercancel = () => { spinDrag = false; };
    spin.onkeydown = e => {
      const d = { ArrowLeft: [0, -.01], ArrowRight: [0, .01], ArrowUp: [.01, 0], ArrowDown: [-.01, 0] }[e.key];
      if (d) { e.preventDefault(); setSpin(S.shot.top + d[0], S.shot.side + d[1]); }
    };
    $('#ft-guide').onchange = e => { ui.saveSettings({ aimGuide: e.target.checked }); draw(); };
    $('#ft-predict').onchange = e => { ui.saveSettings({ predict: e.target.checked }); schedulePrediction(); };
    $('#ft-replay').onclick = () => { if (S.last && !S.playing) { S.balls = clone(S.before); playResult(S.last, false); } };
    $('#ft-undo').onclick = () => { if (!S.playing) { restore(S.before); } };
    $('#ft-safety').onclick = () => {
      if (!canReviewSafety()) return;
      reviewingSafety = !reviewingSafety;
      if (reviewingSafety) safetyMap = Coach.safeLeaves.analyse(S.balls, S.balls.filter(b => b.color === 'red' && !b.potted).map(b => b.id));
      syncControls(); draw();
    };
    $('#ft-remove').onclick = () => {
      if (!S.selected) { ui.toast('Select a ball first.', { tone: 'warn' }); return; }
      S.balls = S.balls.filter(b => b.id !== S.selected); S.selected = null; S.last = null; S.summary = ''; S.before = clone(S.balls); renderPalette(); update();
    };
    $$('[data-layout]', el).forEach(b => b.onclick = () => { stopPlayback(); S.balls = layout(b.dataset.layout); S.before = clone(S.balls); S.selected = null; S.last = null; S.summary = ''; renderPalette(); update(); });
    $('#ft-save').onclick = () => { if (S.last) ui.router.go('create'); };
    document.addEventListener('keydown', e => {
      if (el.hidden || S.mode !== 'aim' || S.playing) return;
      if (e.key === ' ' && document.activeElement === document.body) { e.preventDefault(); shoot(); }
    });
  }

  ui.router.register({
    id: 'free', nav: 'free', el, title: () => 'Free table',
    enter() {
      if (!renderer) renderer = new Coach.renderer.TableRenderer($('#ft-canvas'));
      if (!wired) { wire(); wired = true; }
      renderer.resize();
      update();
      return true;
    },
    leave() { if (S.player) { S.player.pause(); S.playing = false; S.balls = clone(S.last?.balls || S.balls); S.player = null; S.summary = S.last ? summarise(S.last, S.before) : ''; } }
  });
  Coach.freeTable = { state: S };
})(globalThis);

</script>
<script>
/* Screen: turn a shot from the Free Table into a puzzle, and manage the puzzles you have made. */
(function (root) {
  'use strict';
  const Coach = root.Coach, ui = Coach.ui, P = Coach.physics, E = Coach.editor, C = Coach.courses;
  const { $, $$, esc, icon, clone } = ui;
  const el = $('#view-create');
  const LIMIT = 50;

  el.innerHTML = `
    <header class="view-head"><div><p class="eyebrow">Make your own</p><h1 data-focus>Create a puzzle</h1></div></header>
    <div id="cr-body"></div>
    <section class="mine" aria-labelledby="mine-title">
      <div class="section-row"><h2 id="mine-title" class="section-title">Your puzzles</h2>
        <div class="button-row"><button class="btn btn-ghost" id="cr-import" type="button">${icon('upload')}<span>Import puzzles</span></button>
        <button class="btn btn-ghost" id="cr-export" type="button">${icon('download')}<span>Export all</span></button>
        <button class="btn btn-ghost" id="cr-restore" type="button" hidden>${icon('undo')}<span>Restore last removed</span></button></div></div>
      <div id="cr-list"></div>
      <input type="file" id="cr-file" accept=".json,application/json" hidden>
    </section>`;

  let renderer = null, preview = null, saved = null;

  function download(data, name) {
    const a = document.createElement('a'), url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ---------- list of saved puzzles ----------
  function renderList() {
    const mine = ui.customPuzzles(), trash = ui.store.trash();
    $('#cr-export').disabled = !mine.length;
    $('#cr-restore').hidden = !trash.length;
    $('#cr-list').innerHTML = mine.length ? `<ul class="mine-list">${mine.map(p => {
      const t = C.tacticOf(p.tactic);
      return `<li><span class="mine-icon">${icon(t.icon)}</span><span class="mine-text"><strong>${esc(p.title)}</strong><small>${esc(p.brief)}</small></span>
        <a class="btn btn-ghost btn-small" href="#/practice/${encodeURIComponent(p.id)}">${icon('play')}<span>Play</span></a>
        <button class="btn btn-ghost btn-small" data-remove="${esc(p.id)}" type="button" aria-label="Remove ${esc(p.title)}">${icon('trash')}<span>Remove</span></button></li>`;
    }).join('')}</ul>` : `<div class="empty small"><p>You have not made any puzzles yet. Take a shot on the Free Table and it will appear here.</p></div>`;
    $$('[data-remove]', el).forEach(b => b.onclick = () => removePuzzle(b.dataset.remove));
  }
  async function removePuzzle(id) {
    const all = ui.customPuzzles(), p = all.find(q => q.id === id);
    if (!p) return;
    const ok = await ui.dialog.confirm({ title: 'Remove this puzzle?', body: `“${p.title}” moves to local trash. You can restore the most recent removal at any time.`, confirmLabel: 'Remove puzzle', danger: true });
    if (!ok) return;
    if (ui.store.set('custom-trash', [...ui.store.trash(), p]) && ui.store.set('custom-puzzles', all.filter(q => q.id !== id))) { ui.toast('Puzzle removed. You can restore it.'); renderList(); }
  }
  function restoreLast() {
    const trash = ui.store.trash().slice(), all = ui.customPuzzles();
    if (!trash.length) return;
    if (all.length >= LIMIT) { ui.toast(`You can keep up to ${LIMIT} puzzles. Export or remove one first.`, { tone: 'warn' }); return; }
    const p = trash.pop();
    if (ui.store.set('custom-puzzles', [...all, p]) && ui.store.set('custom-trash', trash)) { ui.toast('Puzzle restored.', { tone: 'good' }); renderList(); }
  }
  async function importFile(file) {
    try {
      if (file.size > 5e6) throw Error('The file must be smaller than 5 MB.');
      const input = JSON.parse(await file.text()), items = Array.isArray(input) ? input : input.puzzles;
      if (!Array.isArray(items) || !items.length || items.length > LIMIT) throw Error(`The file must contain 1–${LIMIT} puzzles.`);
      const all = ui.customPuzzles();
      if (all.length + items.length > LIMIT) throw Error(`This would pass the ${LIMIT}-puzzle limit. Remove some first.`);
      const checked = [];
      for (let i = 0; i < items.length; i++) {
        const q = E.validateAndSimulate({ ...items[i], id: 'custom-import-' + Date.now() + '-' + i });
        checked.push({ ...q.puzzle, recording: E.snapshot(q.result) });
        if (i % 3 === 0) await new Promise(r => setTimeout(r, 0));
      }
      if (ui.store.set('custom-puzzles', all.concat(checked))) { ui.toast(`Verified and imported ${checked.length} puzzle${checked.length === 1 ? '' : 's'}.`, { tone: 'good' }); renderList(); }
    } catch (error) { ui.toast('Import failed: ' + error.message, { tone: 'warn', ms: 6500 }); }
  }

  // ---------- builder ----------
  function emptyState() {
    $('#cr-body').innerHTML = `<div class="empty hero-empty"><div class="empty-art">${icon('table', 'xl')}</div>
      <h2>Start with a shot</h2><p>Set up the balls on the Free Table, take the shot you want to teach, then come back here.</p>
      <div class="button-row center"><a class="btn btn-primary btn-xl" href="#/free">${icon('table')}Go to the Free Table</a></div></div>`;
  }

  function builder(capture) {
    const initial = capture.initial.filter(b => !b.potted), targets = initial.filter(b => b.id !== 'cue');
    const first = capture.result.events.find(e => e.type === 'ball' && e.ids.includes('cue'));
    const firstId = first ? first.ids.find(id => id !== 'cue') : null;
    const defaultTarget = targets.find(b => b.id === firstId) || targets[0];
    const types = Object.entries(E.OBJECTIVE_LABELS);
    const icons = { distance: 'gauge', rail: 'rail', snooker: 'eye-off', escape: 'bounce', target: 'target' };
    $('#cr-body').innerHTML = `<form class="builder" id="cr-form" novalidate>
      <div class="builder-preview"><div class="table-frame"><canvas id="cr-canvas" aria-label="Preview of your shot and the target zone"></canvas></div>
        <p class="fine" id="cr-differs" hidden></p></div>
      <div class="builder-fields">
        <label class="field"><span>Puzzle name</span><input id="cr-title" maxlength="60" value="My safety puzzle" autocomplete="off"></label>
        <fieldset class="field"><legend>What should the learner do?</legend>
          <div class="radio-cards">${types.map(([id, label], i) => `<label class="radio-card"><input type="radio" name="type" value="${id}" ${i === 0 ? 'checked' : ''}><span>${icon(icons[id])}<b>${esc(label)}</b></span></label>`).join('')}</div></fieldset>
        <div class="field-row">
          <label class="field"><span>Ball to hit first</span><select id="cr-target">${targets.map(b => `<option value="${esc(b.id)}" ${b === defaultTarget ? 'selected' : ''}>${esc(b.color.charAt(0).toUpperCase() + b.color.slice(1))} ball (${esc(b.id)})</option>`).join('')}</select></label>
          <label class="field"><span>Target area size <output id="cr-radius-out">18 cm</output></span><input id="cr-radius" type="range" min="5" max="60" value="18" aria-label="Target area radius in centimetres"></label>
        </div>
        <label class="field"><span>Instruction shown to learners</span><input id="cr-brief" maxlength="140" autocomplete="off"></label>
        <label class="field"><span>Coach’s note <small>(optional)</small></span><textarea id="cr-note" rows="3" maxlength="600" placeholder="What should the learner notice?"></textarea></label>
        <p class="form-error" id="cr-error" role="alert" hidden></p>
        <div class="button-row"><button class="btn btn-primary btn-xl" id="cr-save" type="submit">${icon('check')}<span>Check and save puzzle</span></button></div>
      </div></form>`;
    renderer = new Coach.renderer.TableRenderer($('#cr-canvas'));
    const form = () => ({ title: $('#cr-title').value, targetId: $('#cr-target').value, type: $('#cr-form [name=type]:checked').value, zoneRadius: Number($('#cr-radius').value) / 100, brief: $('#cr-brief').value, note: $('#cr-note').value });
    const updatePreview = () => {
      const f = form(), draft = E.fromCapture(capture, { ...f, id: 'preview' });
      preview = { draft, rerun: P.simulate(draft.balls, draft.referenceShot, P.DEFAULTS, { recordFrames: false }) };
      const cueEnd = preview.rerun.balls.find(b => b.id === 'cue');
      renderer.draw({ balls: draft.balls.map(P.createBall), shotPath: preview.rerun.path,
        rings: [{ id: f.targetId, tone: 'warn', pulse: false }],
        zones: [{ x: cueEnd.x, y: cueEnd.y, radius: f.zoneRadius, label: 'Target area', tone: 'gold' }],
        labels: [{ id: f.targetId, text: 'Hit first', tone: 'warn' }], animate: true });
      $('#cr-radius-out').textContent = Math.round(f.zoneRadius * 100) + ' cm';
    };
    const syncBrief = () => {
      if ($('#cr-brief').dataset.touched) return;
      const target = initial.find(b => b.id === $('#cr-target').value);
      $('#cr-brief').value = E.defaultBrief($('#cr-form [name=type]:checked').value, target?.color);
    };
    $('#cr-brief').oninput = () => { $('#cr-brief').dataset.touched = '1'; };
    syncBrief();
    $$('#cr-form [name=type]').forEach(r => r.onchange = () => { syncBrief(); updatePreview(); });
    $('#cr-target').onchange = () => { syncBrief(); updatePreview(); }; $('#cr-radius').oninput = updatePreview;
    const differs = JSON.stringify(ui.settings.params) !== JSON.stringify(sanitized(P.DEFAULTS));
    $('#cr-differs').hidden = !differs;
    $('#cr-differs').textContent = 'Puzzles always use the standard table. The path above is replayed on it, so it may differ slightly from what you saw on your own table settings.';
    updatePreview();
    $('#cr-form').onsubmit = ev => {
      ev.preventDefault();
      const err = $('#cr-error');
      try {
        const f = form(), input = E.fromCapture(capture, f), checked = E.validateAndSimulate(input), all = ui.customPuzzles();
        if (all.length >= LIMIT) throw Error(`You can keep up to ${LIMIT} puzzles. Export a backup, then remove some.`);
        if (!ui.store.set('custom-puzzles', [...all, { ...checked.puzzle, recording: E.snapshot(checked.result) }])) return;
        err.hidden = true; saved = checked.puzzle;
        renderList(); success();
      } catch (error) { err.hidden = false; err.textContent = error.message; err.focus?.(); }
    };
  }
  const sanitized = params => Coach.storeFactory.sanitizeParams(params);

  function success() {
    $('#cr-body').innerHTML = `<div class="empty hero-empty good"><div class="empty-art">${icon('check', 'xl')}</div>
      <h2>“${esc(saved.title)}” is saved</h2><p>It was replayed on the standard table and passed every check.</p>
      <div class="button-row center"><a class="btn btn-primary btn-xl" href="#/practice/${encodeURIComponent(saved.id)}">${icon('play')}Play it now</a>
      <a class="btn btn-ghost btn-xl" href="#/free">${icon('table')}Make another</a></div></div>`;
    Coach.sound.play('success');
  }

  function wire() {
    $('#cr-import').onclick = () => $('#cr-file').click();
    $('#cr-file').onchange = e => { const f = e.target.files?.[0]; if (f) importFile(f); e.target.value = ''; };
    $('#cr-export').onclick = () => {
      const mine = ui.customPuzzles();
      if (!mine.length) { ui.toast('You have no puzzles to export yet.'); return; }
      download({ format: 'snooker-safety-coach', version: 1, puzzles: mine }, 'snooker-custom-puzzles.json');
      ui.toast(`Exported ${mine.length} puzzle${mine.length === 1 ? '' : 's'}.`, { tone: 'good' });
    };
    $('#cr-restore').onclick = restoreLast;
  }

  let wired = false;
  ui.router.register({
    id: 'create', nav: 'create', el, title: () => 'Create a puzzle',
    enter() {
      if (!wired) { wire(); wired = true; }
      if (renderer) { renderer.destroy(); renderer = null; }
      saved = null;
      const capture = ui.session.capture;
      capture && capture.result ? builder(capture) : emptyState();
      renderList();
      return true;
    },
    leave() { if (renderer) { renderer.animate(false); } }
  });
})(globalThis);

</script>
<script>
/* Screen: table feel, comfort options and your saved data. */
(function (root) {
  'use strict';
  const Coach = root.Coach, ui = Coach.ui, P = Coach.physics, SF = Coach.storeFactory;
  const { $, $$, esc, icon } = ui;
  const el = $('#view-settings');

  el.innerHTML = `
    <header class="view-head"><div><p class="eyebrow">Make it yours</p><h1 data-focus>Settings</h1></div></header>
    <div class="settings-grid">
      <section class="panel" aria-labelledby="st-table"><h2 id="st-table">${icon('table')}Table feel</h2>
        <p class="fine">Applies to the Free Table only. Puzzles are always scored on the standard table, so results stay comparable.</p>
        <div class="preset-grid" id="st-presets" role="group" aria-label="Table presets"></div>
        <details class="soft" id="st-fine"><summary>Fine-tune the physics</summary><div id="st-sliders"></div>
          <div class="button-row"><button class="btn btn-ghost" id="st-reset-params" type="button">${icon('restart')}<span>Back to the standard table</span></button></div></details>
      </section>
      <section class="panel" aria-labelledby="st-comfort"><h2 id="st-comfort">${icon('settings')}Comfort</h2>
        <label class="row-switch"><span><b>Sound effects</b><small>Ball clicks, cushion thuds and pocket drops</small></span><input type="checkbox" id="st-sound"><span class="switch-box" aria-hidden="true"></span></label>
        <label class="row-switch"><span><b>Label coloured balls</b><small>Adds a letter to each colour, such as Y for yellow</small></span><input type="checkbox" id="st-labels"><span class="switch-box" aria-hidden="true"></span></label>
        <label class="row-switch"><span><b>Aim guide on the Free Table</b><small>Shows the contact point and where each ball goes</small></span><input type="checkbox" id="st-guide"><span class="switch-box" aria-hidden="true"></span></label>
        <div class="row-select"><span><b>Animation</b><small>Follows your device unless you choose otherwise</small></span>
          <div class="segmented" role="group" aria-label="Animation" id="st-motion"><button type="button" data-motion="auto">Automatic</button><button type="button" data-motion="full">Full</button><button type="button" data-motion="reduce">Reduced</button></div></div>
        <div class="row-select"><span><b>Replay speed</b><small>Used by every replay</small></span>
          <div class="segmented" role="group" aria-label="Replay speed" id="st-speed">${[.25, .5, 1, 2].map(v => `<button type="button" data-speed="${v}">${v}×</button>`).join('')}</div></div>
      </section>
      <section class="panel" aria-labelledby="st-data"><h2 id="st-data">${icon('download')}Your data</h2>
        <p class="fine">Everything is stored in this browser only. Nothing is uploaded.</p>
        <div class="button-row stack">
          <button class="btn btn-ghost" id="st-guide-open" type="button">${icon('info')}<span>Show the how-it-works guide</span></button>
          <button class="btn btn-ghost" id="st-model" type="button">${icon('book')}<span>About the physics model</span></button>
          <button class="btn btn-danger" id="st-reset-progress" type="button">${icon('trash')}<span>Reset my progress</span></button>
        </div>
      </section>
    </div>`;

  function sliders() {
    $('#st-sliders').innerHTML = SF.PARAM_SPEC.map(s => `<label class="slider-row"><span><b>${esc(s.label)}</b><small>${esc(s.hint)}</small></span>
      <input type="range" data-param="${s.key}" min="${s.min}" max="${s.max}" step="${s.step}" aria-label="${esc(s.label)}"><output data-out="${s.key}"></output></label>`).join('');
    $$('[data-param]', el).forEach(input => {
      input.oninput = () => {
        const key = input.dataset.param;
        ui.saveSettings({ params: { [key]: Number(input.value) }, preset: 'custom' });
        sync();
      };
    });
  }
  const fmt = (spec, value) => (spec.step < .01 ? value.toFixed(3) : spec.step < 1 ? value.toFixed(2) : value.toFixed(1)) + spec.unit;

  function sync() {
    const s = ui.settings;
    $('#st-presets').innerHTML = SF.PRESETS.map(p => `<button type="button" class="preset" data-preset="${p.id}" aria-pressed="${s.preset === p.id}"><b>${esc(p.label)}</b><small>${esc(p.blurb)}</small></button>`).join('');
    $$('[data-preset]', el).forEach(b => b.onclick = () => {
      const preset = SF.PRESETS.find(p => p.id === b.dataset.preset);
      ui.saveSettings({ preset: preset.id, params: { ...P.DEFAULTS, ...preset.params } });
      ui.toast(`${preset.label} applied to the Free Table.`, { tone: 'good', ms: 2400 });
      sync();
    });
    for (const spec of SF.PARAM_SPEC) {
      const input = $(`[data-param="${spec.key}"]`, el);
      if (input) { input.value = s.params[spec.key]; $(`[data-out="${spec.key}"]`, el).textContent = fmt(spec, s.params[spec.key]); }
    }
    $('#st-sound').checked = s.sound; $('#st-labels').checked = s.colourLabels; $('#st-guide').checked = s.aimGuide;
    $$('[data-motion]', el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.motion === s.reduceMotion)));
    $$('#st-speed [data-speed]', el).forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.speed) === s.replaySpeed)));
  }

  function wire() {
    sliders();
    $('#st-sound').onchange = e => { ui.saveSettings({ sound: e.target.checked }); if (e.target.checked) Coach.sound.play('tick'); };
    $('#st-labels').onchange = e => ui.saveSettings({ colourLabels: e.target.checked });
    $('#st-guide').onchange = e => ui.saveSettings({ aimGuide: e.target.checked });
    $$('[data-motion]', el).forEach(b => b.onclick = () => { ui.saveSettings({ reduceMotion: b.dataset.motion }); sync(); });
    $$('#st-speed [data-speed]', el).forEach(b => b.onclick = () => { ui.saveSettings({ replaySpeed: Number(b.dataset.speed) }); sync(); });
    $('#st-reset-params').onclick = () => { ui.saveSettings({ preset: 'baseline', params: { ...P.DEFAULTS } }); ui.toast('Standard table restored.', { tone: 'good', ms: 2400 }); sync(); };
    $('#st-guide-open').onclick = () => Coach.guide.open();
    $('#st-model').onclick = () => { ui.dialog.open(`<div class="notes"><p class="eyebrow">${icon('book')}Behind the scenes</p><h2>About the physics model</h2>
      <ul class="plain"><li>Balls slide, then roll. Raised cushion contact couples side spin, topspin and cloth friction, with grip limited by the impact.</li>
      <li>The standard table is a <b>teaching baseline</b> inside published ranges. It is not a measurement of a real match table.</li>
      <li>The model leaves out jumps, swerve, cloth nap and pocket jaws, and treats packed balls approximately.</li>
      <li>The “blocked angle” is a teaching measure of how much of the red a colour hides. It is not a probability.</li>
      <li>Safe-leave maps apply the paper’s direct-line exposure threshold to the final layout. They show geometric candidates, not guaranteed reachable positions.</li>
      <li>A search that finds no matching shot never proves a route is impossible.</li></ul>
      <div class="button-row"><button class="btn btn-primary" data-autofocus data-close>Close</button></div></div>`, { label: 'About the physics model' });
      $('#dialog [data-close]').onclick = () => ui.dialog.close(); };
    $('#st-reset-progress').onclick = async () => {
      const ok = await ui.dialog.confirm({ title: 'Reset your progress?', body: 'This clears your scores and mastered badges on every puzzle. Your own puzzles and settings are kept.', confirmLabel: 'Reset progress', danger: true });
      if (ok) { ui.store.resetProgress(); ui.session.drafts.clear(); ui.session.assessment = null; ui.toast('Progress cleared.', { tone: 'good' }); }
    };
  }

  let wired = false;
  ui.router.register({
    id: 'settings', nav: 'settings', el, title: () => 'Settings',
    enter() { if (!wired) { wire(); wired = true; } sync(); return true; }
  });
})(globalThis);

</script>
<script>
/* The how-it-works guide: three animated slides, shown once on the first visit and on request. */
(function (root) {
  'use strict';
  const Coach = root.Coach, ui = Coach.ui, { $, $$, icon } = ui;

  const table = inner => `<svg class="guide-art" viewBox="0 0 320 180" role="img" aria-label="__ALT__"><defs>
      <radialGradient id="g-felt" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2f8264"/><stop offset="1" stop-color="#154a39"/></radialGradient>
      <radialGradient id="g-white" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9cfbd"/></radialGradient>
      <radialGradient id="g-red" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ff7468"/><stop offset="1" stop-color="#8e1f19"/></radialGradient></defs>
    <rect x="2" y="2" width="316" height="176" rx="14" fill="#4a2a14"/><rect x="16" y="16" width="288" height="148" rx="6" fill="url(#g-felt)"/>${inner}</svg>`;
  const SLIDES = [
    { title: 'Draw the route', text: 'Drag from the white ball. Add every cushion and where it should stop.',
      art: table(`<path d="M70 112 C 120 112 150 44 208 62" fill="none" stroke="#59d0ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="190" class="g-draw"/>
        <circle cx="208" cy="62" r="7" fill="url(#g-red)"/><circle cx="70" cy="112" r="7" fill="url(#g-white)"/>
        <circle cx="70" cy="112" r="14" fill="none" stroke="#59d0ff" stroke-width="2" class="g-pulse"/>`), alt: 'A cyan line is drawn from the white ball towards a red ball' },
    { title: 'We test it for real', text: 'A matching shot is played on a physics table. Nothing is guessed.',
      art: table(`<path d="M70 112 C 120 112 150 44 200 64" fill="none" stroke="#59d0ff" stroke-opacity=".45" stroke-width="3" stroke-dasharray="5 6"/>
        <circle cx="214" cy="60" r="7" fill="url(#g-red)"><animate attributeName="cx" values="214;214;262;262" keyTimes="0;.62;.85;1" dur="3s" repeatCount="indefinite"/><animate attributeName="cy" values="60;60;48;48" keyTimes="0;.62;.85;1" dur="3s" repeatCount="indefinite"/></circle>
        <circle r="7" fill="url(#g-white)"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;.85;1" keyTimes="0;.62;1" calcMode="linear" path="M70 112 C 120 112 150 44 200 64 L 226 84"/></circle>`), alt: 'The white ball rolls along the line, hits the red ball and both roll on' },
    { title: 'Learn from the leave', text: 'See your score, compare with the reference and find the one thing to change.',
      art: table(`<g transform="translate(86 90)"><circle r="34" fill="none" stroke="#ffffff22" stroke-width="9"/><circle r="34" fill="none" stroke="#e3b94f" stroke-width="9" stroke-linecap="round" stroke-dasharray="214" stroke-dashoffset="214" transform="rotate(-90)" class="g-ring"/><text y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#f4eedb" font-family="Georgia,serif">86</text></g>
        <g font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#f4eedb"><text x="150" y="58">Safety</text><rect x="196" y="51" width="90" height="7" rx="3.5" fill="#ffffff22"/><rect x="196" y="51" width="80" height="7" rx="3.5" fill="#7be0a4" class="g-bar"/>
        <text x="150" y="84">Finish</text><rect x="196" y="77" width="90" height="7" rx="3.5" fill="#ffffff22"/><rect x="196" y="77" width="64" height="7" rx="3.5" fill="#7be0a4" class="g-bar"/>
        <text x="150" y="110">Route</text><rect x="196" y="103" width="90" height="7" rx="3.5" fill="#ffffff22"/><rect x="196" y="103" width="48" height="7" rx="3.5" fill="#e3b94f" class="g-bar"/></g>`), alt: 'A score ring reading 86 with three progress bars' }
  ];

  let step = 0;
  function show() {
    const s = SLIDES[step], last = step === SLIDES.length - 1;
    $('#guide-art').innerHTML = s.art.replace('__ALT__', s.alt);
    $('#guide-title').textContent = s.title; $('#guide-text').textContent = s.text;
    $('#guide-count').textContent = `Step ${step + 1} of ${SLIDES.length}`;
    $('#guide-dots').innerHTML = SLIDES.map((_, i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('');
    $('#guide-back').hidden = step === 0;
    $('#guide-next').innerHTML = last ? `Start practising${icon('arrow-right')}` : `Next${icon('arrow-right')}`;
  }
  function open() {
    step = 0;
    ui.dialog.open(`<div class="guide"><div id="guide-art" class="guide-frame"></div>
      <p class="eyebrow" id="guide-count"></p><h2 id="guide-title"></h2><p id="guide-text" class="lede"></p>
      <div class="guide-foot"><div class="dots-nav" id="guide-dots" aria-hidden="true"></div>
        <div class="button-row"><button class="btn btn-ghost" id="guide-skip" type="button">Skip</button><button class="btn btn-ghost" id="guide-back" type="button">${icon('arrow-left')}Back</button><button class="btn btn-primary" id="guide-next" type="button" data-autofocus></button></div></div></div>`,
      { label: 'How Snooker Safety Coach works', onClose: () => ui.store.set('onboarded', true) });
    show();
    $('#guide-skip').onclick = () => ui.dialog.close();
    $('#guide-back').onclick = () => { step = Math.max(0, step - 1); show(); };
    $('#guide-next').onclick = () => {
      if (step < SLIDES.length - 1) { step++; show(); return; }
      ui.dialog.close();
      const next = Coach.courses.recommended(ui.builtIn(), id => ui.store.statusOf(id));
      if (next) ui.router.go('practice/' + encodeURIComponent(next.id));
    };
  }
  Coach.guide = { open };
})(globalThis);

</script>
<script>
/* Start-up: apply settings, wire the shared chrome, open the right screen. */
(function (root) {
  'use strict';
  const Coach = root.Coach, ui = Coach.ui, { $ } = ui;

  ui.applySettings();

  const dlg = $('#dialog');
  dlg.addEventListener('close', () => { const cb = ui.dialog.onClose; ui.dialog.onClose = null; if (cb) cb(); });
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  $('#dialog-close').onclick = () => dlg.close();
  $('#open-guide').onclick = () => Coach.guide.open();

  // Surface unexpected errors instead of failing silently; the learner's work stays in memory.
  root.addEventListener('error', () => ui.toast('Something unexpected happened. Your work is safe; try that again.', { tone: 'warn', ms: 6000 }));

  ui.router.start();
  if (!ui.store.get('onboarded', false) && ui.router.path().name === 'home') setTimeout(() => Coach.guide.open(), 600);
})(globalThis);

</script>
</body>
